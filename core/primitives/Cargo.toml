[package]
name = "dereth-primitives"
description = "The shared vocabulary every crate compiles against: identifiers, space, time, shapes, text, the arithmetic policy and the interface traits between crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# A stray tests/*.rs cannot become a test target silently.
autotests = false

[features]
# `text`'s conversions use the host's own NLS functions (`kernel32`, on a Windows host) instead of
# the Windows-1252 table: the live ANSI code page, whatever it is. For code page 1252 the two agree,
# best-fit mappings included, and a Windows test with this feature on holds them to that. The one
# piece of this crate that calls the operating system, and the only code allowed `unsafe`; only the
# application enables it (`dereth-client-runtime`, for `platform::text::HostAcp`). Off, and off
# Windows, the crate is plain data and pure conversions.
host-nls = []
# `num::math` calls the host C runtime (`std`) instead of the portable functions: bit-exact with
# the UCRT on Windows, host-dependent elsewhere. For measuring against, not for shipping.
host-libm = []

[dependencies]
thiserror.workspace = true
# `num::math`: the portable transcendental functions. `pxfm` is BSD-3-Clause OR
# Apache-2.0, `libm` is MIT; both pure Rust. No other crate names either directly.
pxfm = "=0.1.30"
libm = "=0.2.16"

# The workspace's levels, but `unsafe_code` is `deny` rather than `forbid` so that `text::windows`,
# the host NLS arm behind `host-nls`, can carry the one `#[allow(unsafe_code)]`. `cargo xtask seams`
# checks that nothing else in the crate does.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
[lints.clippy]
cast_possible_truncation = "warn"
undocumented_unsafe_blocks = "warn"

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"
