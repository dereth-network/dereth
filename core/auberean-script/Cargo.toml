[package]
name = "auberean-script"
description = "The script machine: the compiled script library, its load pass, the packed object graph codec, the interpreter, the reference table and the native interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[features]
# Tier switches: select the test binaries that read the retail installs (`dat`) and the recorded
# sessions (`corpus`, which needs the installs too).
retail-dats = ["auberean-dat/retail-dats"]
retail-corpus = ["retail-dats", "auberean-testkit/captures"]

[dependencies]
auberean-port.workspace = true
auberean-primitives.workspace = true
auberean-dat.workspace = true
auberean-assets.workspace = true
auberean-text.workspace = true

[dev-dependencies]
auberean-dat = { workspace = true, features = ["test-support"] }
auberean-testkit.workspace = true

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]

[[test]]
name = "corpus"
path = "tests/corpus/main.rs"
required-features = ["retail-corpus"]
