[package]
name = "auberean-text"
description = "Localized text as the September 2013 Asheron's Call 2 client writes it: string references and their variables, numbers in a language's format, and the string tables' meta language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[features]
# Tier switch: selects the `dat` test binary, whose tests render the retail string tables.
retail-dats = ["auberean-dat/retail-dats"]

[dependencies]
auberean-dat.workspace = true
auberean-assets.workspace = true
auberean-primitives.workspace = true

[dev-dependencies]
auberean-dat = { workspace = true, features = ["test-support", "fs"] }

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]
