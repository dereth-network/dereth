[package]
name = "dereth-animation"
description = "Animation and motion: motion tables, the frame player, part arrays, animation hooks, physics scripts and particles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# A stray tests/*.rs can no longer become a test target silently.
autotests = false

[features]
# Tier switch only: no code is gated on it. It selects the `dat` test binary, whose
# modules read the retail dats under $DERETH_TEST_DAT_DIR.
retail-dats = []

[dependencies]
dereth-primitives.workspace = true
# The movement formulas (run rate, jump height) have one implementation, in dereth-rules.
dereth-rules.workspace = true
thiserror.workspace = true

# No dependency on the decoders (`dereth-assets`): the runtime shapes here are built from decoded
# records by `dereth_world_data::anim_convert`, and the records the two share are `dereth_primitives`'.
[dev-dependencies]
dereth-dat = { workspace = true, features = ["test-support"] }
# The `dat` tier reads the retail dats through the decoders and the shared converters.
dereth-assets.workspace = true
dereth-world-data.workspace = true

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]
