[package]
name = "auberean-physics"
description = "Bodies that move: the shared swept-sphere core with this world's settings, the world's cells for it (terrain and the solid objects placed on it), the motion of a body from its movement input, the physics step, and the chase camera."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[features]
# Tier switches: `retail-dats` selects the `dat` test binary (walking the September 2013 world);
# `retail-corpus` the `corpus` binary (bodies driven by the recorded sessions' movement).
retail-dats = ["auberean-dat/retail-dats", "auberean-assets/retail-dats", "auberean-world/retail-dats"]
retail-corpus = ["auberean-testkit/captures"]

[dependencies]
auberean-primitives.workspace = true
auberean-dat.workspace = true
auberean-assets.workspace = true
auberean-world.workspace = true
# The swept-sphere transition, its geometry and its collision arms are Dereth's, with this
# world's settings and cells.
dereth-physics.workspace = true
dereth-primitives.workspace = true
dereth-terrain.workspace = true

[dev-dependencies]
auberean-dat = { workspace = true, features = ["test-support", "fs"] }
auberean-protocol.workspace = true
auberean-testkit.workspace = true

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]

[[test]]
name = "corpus"
path = "tests/corpus/main.rs"
required-features = ["retail-dats", "retail-corpus"]
