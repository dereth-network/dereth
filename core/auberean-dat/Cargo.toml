[package]
name = "auberean-dat"
description = "The Asheron's Call 2 data-file container, its type table and the record reader every decoder reads through."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# A stray tests/*.rs cannot become a test target silently.
autotests = false

[features]
# Native hosts: open a dat from a file (`DatFile::open`) and find an install's files (`locate`).
# Off by default, so the crate itself does no I/O and builds for any target.
fs = []
# `auberean_dat::testing`: where every crate's tests find the retail installs. Test builds only: crates
# enable it in `[dev-dependencies]`.
test-support = ["fs"]
# Tier switch: selects the `dat` test binary, whose tests read the retail installs.
retail-dats = ["test-support"]

[dependencies]
auberean-primitives.workspace = true
# The container itself: this crate gives it this game's layout.
dereth-dat.workspace = true
dereth-primitives.workspace = true

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]
