[package]
name = "dereth-client-runtime"
description = "The client with no UI, no device and no window: the application state machine, its frame loop and everything the frame needs that is not drawing or an OS call."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The headless half of the client.
#
# The rule this crate exists to make checkable is a dependency rule: `cargo tree -e normal -p
# dereth-client-runtime` lists no crate under `dereth/client/crates/` (the renderers, the modern UI,
# the world drawing, the clipboard and the console) and none of `winit`, `windows`, `cpal` or `ash`.
# Nothing here draws, holds a device, owns a window or makes an OS call; `dereth-client` keeps all
# four.
[features]
# Opt-in fixture controls and observations.
test-support = ["dereth-client-model/test-support", "dereth-client-net/test-support"]
# Tier switch only: no code is gated on it. The lib tests that read the retail dats under
# $DERETH_TEST_DAT_DIR are ignored without it, so a checkout with no dats tests green.
retail-dats = []

[dependencies]
dereth-presentation.workspace = true
dereth-rules.workspace = true
# `host-nls`: platform/text.rs -- the host's ANSI code page. See below.
dereth-primitives = { workspace = true, features = ["host-nls"] }
# The shared object model and chat composition used by runtime receivers.
dereth-client-model.workspace = true
# net.rs -- the UDP transport and the session above it. `ClientNetwork` hands the client session
# (`dereth_client_net::client_session`) a socket and reads nothing else.
dereth-client-net = { workspace = true, default-features = true }
dereth-transport.workspace = true
dereth-protocol.workspace = true
dereth-animation.workspace = true
# The dat -> physics / animation adapters (`anim_assets`, `land_source`,
# `env_cells`, `landblock`, the setup geometry, the physics-setup facts), shared with the server.
# Re-exported at their old paths here.
dereth-world-data.workspace = true
dereth-assets.workspace = true
dereth-dat.workspace = true
# The landscape's block window, which the world streamer keeps resident around the viewer. The
# drawing side builds each slot's mesh and reads the same window.
dereth-landscape.workspace = true
# The landscape's geometry and static contents: the world builder places the same scenery and
# statics over the same landblock meshes the drawing uses.
dereth-terrain.workspace = true
# platform/text.rs -- the host's ANSI code page -- is `dereth-primitives`' `text` module
# with its `host-nls` feature, enabled above: the audited kernel32 NLS boundary, which names no
# other crate. It is the same kind of host call `net.rs`'s socket and `assets.rs`'s dat reads
# already make here, and this crate is the application side that is allowed to switch it on.
# `character.rs` drives the collision and movement engine and the motion tables; it names no
# device: `dereth-physics` is `dereth-primitives` alone.
dereth-physics.workspace = true
# `camera.rs`'s `apply_preference_requests` filters `UiRequest::SetPreference`, which is
# `dereth-client-contract`'s type; `dereth_ui_screens::{PrefValue, UiRequest}` are re-exports of
# these.
dereth-client-contract.workspace = true
# `teleport.rs` names the two portal sound ids. `dereth-audio` is the mixer and the
# decoders; the device is `cpal`, which is `dereth-desktop`'s dependency and not this crate's.
dereth-audio.workspace = true
thiserror.workspace = true
# The runtime's progress lines, problems and frame-loop spans. A facade only: whoever runs the
# runtime (the client, the headless binary) installs the subscriber that receives them.
tracing.workspace = true
# The monotonic and wall clocks. On every native target these are `std::time::Instant` and
# `SystemTime` re-exported unchanged; in a browser, where `std`'s clocks panic, they read the
# page's `performance.now()` and `Date.now()`.
web-time.workspace = true
# object_identity.rs -- the cache of which ids two eras' files share as the same object is keyed
# by both files' hashes.
blake3.workspace = true

[dev-dependencies]
dereth-client-runtime = { path = ".", default-features = false, features = ["test-support"] }
dereth-client-net = { workspace = true, default-features = true, features = ["test-support"] }
dereth-dat = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
