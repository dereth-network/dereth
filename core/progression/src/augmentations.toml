# What end-of-retail characters held, by level: the augmentations they bought with experience
# (the heritage's free one aside) and their luminance auras. Past `warn_past`, a character is
# possible but unusual for its level, and is warned of. Below level 200 luminance cannot be earned,
# so no aura can be held there.

[[band]]
to = 150
typical = "0"
warn_past = 2

[[band]]
to = 200
typical = "0–1"
warn_past = 8

[[band]]
to = 230
typical = "2"
warn_past = 12
luminance_warn_past = 1

[[band]]
to = 260
typical = "8"
warn_past = 23
luminance_warn_past = 10

[[band]]
to = 275
typical = "31"
warn_past = 44
luminance_warn_past = 40

# The quests that grant a skill credit, each counted as the server's skill credit check counts
# it: once for each time it was solved, up to `solves`. A character can do it from `from_level`;
# one that `luminance` marks is bought with luminance.

[[quest_credit]]
quest = "OswaldManualCompleted"
name = "Oswald's skill manual"
from_level = 90
solves = 1

[[quest_credit]]
quest = "ArantahKill1"
name = "Aun Ralirea's figurine"
from_level = 80
solves = 1

[[quest_credit]]
quest = "LumAugSkillQuest"
name = "Nalicana's skill credits"
from_level = 200
solves = 2
luminance = true
