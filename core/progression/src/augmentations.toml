# What a character can gain beyond its build: the augmentations bought with experience, those
# bought with luminance, the warning band for each, and the quests that grant skill credits.
#
# An augmentation is held as an int property of the character, `property`. One bought with
# experience costs what its gem weenie (`gem`, class `class`) says, `AugmentationCost`; the
# costs are the world's, so they are not written here. `max` is how many one character can
# hold, the heritage's free one among them. `family` names a shared limit: the innate
# attributes' ten, the resistances' two. An innate augmentation raises its attribute's innate
# value by 5 (never past 100); a skill augmentation specializes a skill already trained, which
# creation could not specialize.

[family]
innate = 10
resistance = 2

