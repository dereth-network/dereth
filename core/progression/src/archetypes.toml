# The built-in archetypes. Each is what a player of that kind chose: the innate split (Strength,
# Endurance, Coordination, Quickness, Focus, Self; 330 points, each 10 to 100), the skills to
# specialize and train, most wanted first, and how the experience is shared. A skill is the data
# files' name, spaces and case aside; `A|B` is A where the files have it, else B. An archetype
# whose specialized skills the files lack is not offered.
#
# The weights are ranks: a target of weight 70 gains 70 ranks for every 100 its archetype's main
# skill gains, until it reaches its cap. They are the ranks players of each kind had at the end of
# retail, from level 30 to 180, as a share of their main skill's. The innate splits are the ones
# those players chose most, and the skills the ones most of them trained, the commonest first.
# Salvaging, which almost none of them raised, gets no share: it keeps creation's free ranks.

[[archetype]]
