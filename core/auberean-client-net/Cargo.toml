[package]
name = "auberean-client-net"
description = "The client's session, sans-IO: the game login, the login connection held all session, world connections reached by referral, the receive queues and their drain order, messages in and out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
auberean-primitives.workspace = true
auberean-protocol.workspace = true
# The friends stream: its values and its client session.
auberean-friends.workspace = true
# The connection manager (connections, referral walk, server switch, queues) and the transport
# are Dereth's, shared: the receive queues are a setting.
dereth-client-net.workspace = true
dereth-transport.workspace = true
dereth-primitives.workspace = true

[dev-dependencies]
yalain-net.workspace = true
auberean-testkit = { workspace = true, features = ["double"] }

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"
