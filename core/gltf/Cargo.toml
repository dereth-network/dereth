[package]
name = "dereth-gltf"
description = "A static glTF scene read for a world builder: its parts, each with its frame and triangles, and its materials, every resource kept inside the folder it came from."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# A stray tests/*.rs cannot become a test target silently.
autotests = false

[dependencies]
# Frames and vectors in the client's axes.
dereth-primitives.workspace = true
# The scene, its buffers and its accessors.
gltf.workspace = true
glam.workspace = true
# Buffers and pictures embedded as data URIs.
base64.workspace = true
# A material's base color picture.
png.workspace = true

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"
