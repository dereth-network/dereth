[package]
name = "auberean-protocol"
description = "Every Asheron's Call 2 message both ways: typed, decoded with exact consumption and encoded back to the same bytes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[features]
# Tier switch: selects the `corpus` test binary, whose tests read every recorded message.
# Its script-argument test also reads the September 2013 install.
retail-corpus = []

[dependencies]
auberean-primitives.workspace = true
auberean-script.workspace = true

[dev-dependencies]
auberean-dat = { workspace = true, features = ["test-support"] }
auberean-testkit.workspace = true
rusqlite.workspace = true

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "corpus"
path = "tests/corpus/main.rs"
required-features = ["retail-corpus"]
