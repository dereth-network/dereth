[package]
name = "dereth-chargen"
description = "Character creation's model: the choices, the credits, the rules and the random draws every creation screen is a view over."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# A stray tests/*.rs cannot become a test target silently.
autotests = false

[dependencies]
dereth-primitives.workspace = true
# The creation tables: `CharGen`, `SkillTable`, `ClothingTable`. Decoded values only.
dereth-assets.workspace = true
# The creation arithmetic shared with the server. Off the wire crate, as the UI crates take it.
dereth-rules.workspace = true
# `CharGenResultData`, the finished creation the session sends.
dereth-client-contract.workspace = true

[lints]
workspace = true

[features]
retail-dats = []

[dev-dependencies]
dereth-dat = { workspace = true, features = ["test-support"] }

[[test]]
name = "dat"
path = "tests/dat.rs"
required-features = ["retail-dats"]
