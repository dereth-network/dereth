[package]
name = "dereth-navigation"
description = "Navigation: a walkable route from one position to another, in a dungeon or outdoors, through the right corridors and streets and around the objects in them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# A stray tests/*.rs cannot become a test target silently.
autotests = false

[dependencies]
dereth-primitives.workspace = true
dereth-physics.workspace = true
thiserror.workspace = true

[dev-dependencies]
dereth-dat = { workspace = true, features = ["test-support"] }
dereth-assets.workspace = true
dereth-world-data.workspace = true
# The outdoor tests place scenery and landblock statics the way the client does.
dereth-client-runtime.workspace = true

[features]
# Tier switch only: no code is gated on it. It selects the `dat` test binary, whose
# modules read the retail dats under $DERETH_TEST_DAT_DIR.
retail-dats = []

[lints]
workspace = true

[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]
