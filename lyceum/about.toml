# cargo-about's configuration for Lyceum's THIRD-PARTY-LICENSES.html (`cargo xtask package lyceum`
# runs it once for the editor and once for the `lyceum` command). The licenses a crate linked into
# either program may carry; a crate under any other license, or one whose license text cannot be
# found, fails the package.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# What is linked into the programs: not the build scripts' or the tests' dependencies.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The repository's own crates (MIT) are not third-party: their license is LICENSE and NOTICE.txt.
private = { ignore = true }
