[package]
name = "lyceum-foundry"
description = "The Foundry, Lyceum's library: compiles content packs into a world's overlay, bakes an overlay into a copy of a player's data files, and packs pictures into Dereth's client layer."
version = "0.1.0" # Lyceum's own version, shared by its three crates (not the workspace's)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
# Tier switch only: no code is gated on it. It selects the `dat` test binary, whose modules build
# and bake packs over the retail dats under $DERETH_TEST_DAT_DIR.
retail-dats = []

[dependencies]
# The containers, the overlay and its writer.
dereth-dat.workspace = true
dereth-primitives.workspace = true
# Every record's decoder, and the encoders of the records a pack makes.
dereth-assets.workspace = true
# The terrain under a static placed on the ground.
dereth-terrain.workspace = true
# A model's collision walked into by the client's own movement.
dereth-physics.workspace = true
dereth-world-data.workspace = true
# The pictures.
png.workspace = true
# The pack, world and lock files, and the server's names for the content forms (JSON).
serde.workspace = true
serde_json.workspace = true
gltf.workspace = true
glam.workspace = true
base64.workspace = true
toml.workspace = true
# A source file edited in place, its comments and layout kept.
toml_edit.workspace = true

[dev-dependencies]
# `dereth_dat::testing`: where the retail-data tests find the dats, and scratch folders.
dereth-dat = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]
