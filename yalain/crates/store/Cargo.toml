[package]
name = "yalain-store"
description = "Accounts and characters: the server's persistent state, in embedded SQLite or in memory for tests."
version = "0.2.2" # Yalain's own version, shared by every yalain-* crate (not the workspace's)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[features]
# The SQLite store (`SqliteStore`): the native host's database file.
sqlite = ["dep:rusqlite"]

[dependencies]
# The online backup copies a database file before its schema is migrated.
rusqlite = { workspace = true, optional = true, features = ["backup"] }
tracing.workspace = true

[dev-dependencies]
auberean-testkit.workspace = true
# A database file as an earlier version of the store kept it, written directly.
rusqlite.workspace = true

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"
required-features = ["sqlite"]
