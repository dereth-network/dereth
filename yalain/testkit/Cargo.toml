[package]
name = "yalain-testkit"
description = "A whole server on a virtual clock and an in-memory network, with clients that speak the wire: for the server's tests and the replay of recorded logins."
version = "0.2.1" # Yalain's own version, shared by every yalain-* crate (not the workspace's)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[features]
# Tier switch: selects the `corpus` test binary, which replays the recorded logins.
retail-corpus = ["retail-dats"]
# Tier switch: selects the `dat` test binary, which plays our own client against the server with
# the September 2013 install's data; with it, `authored`, a small world of that data written as
# a world database and compiled against the install.
retail-dats = [
    "dep:auberean-assets",
    "dep:auberean-client-sdk",
    "dep:auberean-dat",
    "dep:auberean-script",
    "dep:dereth-dat",
    "dep:yalain-world-db",
]
# Tier switch: selects the `network` test binary, the Dereth Network end to end on loopback: the
# network's hub, an Asheron's Call world and two of this game's worlds, each its own program, with
# a player of each game's client in them. It adds the friends stream's client half, the first
# game's client and where its data is found.
network = [
    "retail-dats",
    "dep:auberean-friends",
    "dep:dereth-client-sdk",
    "dep:dereth-dat",
]

[dependencies]
auberean-assets = { workspace = true, optional = true }
auberean-client-sdk = { workspace = true, optional = true, features = ["fs"] }
auberean-dat = { workspace = true, optional = true, features = ["test-support", "fs"] }
auberean-script = { workspace = true, optional = true }
yalain-world-db = { workspace = true, optional = true }
auberean-friends = { workspace = true, optional = true }
dereth-client-sdk = { workspace = true, optional = true }
dereth-dat = { workspace = true, optional = true, features = ["test-support"] }
auberean-primitives.workspace = true
auberean-protocol.workspace = true
yalain-content.workspace = true
yalain-net.workspace = true
yalain-world.workspace = true
yalain-store.workspace = true
dereth-primitives.workspace = true
dereth-transport.workspace = true

[dev-dependencies]
auberean-assets.workspace = true
auberean-physics.workspace = true
auberean-world.workspace = true
auberean-client-sdk = { workspace = true, features = ["fs"] }
auberean-dat = { workspace = true, features = ["test-support"] }
auberean-friends.workspace = true
auberean-script.workspace = true
auberean-testkit = { workspace = true, features = ["captures"] }
yalain-store = { workspace = true, features = ["sqlite"] }
rusqlite.workspace = true
dereth-protocol.workspace = true
flate2.workspace = true
yalain-world-db.workspace = true

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "corpus"
path = "tests/corpus/main.rs"
required-features = ["retail-corpus"]

[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]

[[test]]
name = "network"
path = "tests/network/main.rs"
required-features = ["network"]
