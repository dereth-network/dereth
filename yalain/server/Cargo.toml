[package]
name = "yalain"
description = "The Asheron's Call 2 server executable: its settings, the data it reads at start, the sockets and the loop."
version = "0.2.0" # Yalain's own version, shared by every yalain-* crate (not the workspace's)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "yalain"
path = "src/main.rs"

[build-dependencies]
# Links the application icon (`assets/yalain.ico`) into the executable. Explorer, the task bar and
# Alt-Tab read the icon out of the binary before any of our code runs, so it cannot be a file
# loaded at start-up.
embed-resource = "3"

[dependencies]
auberean-assets.workspace = true
auberean-dat = { workspace = true, features = ["fs"] }
auberean-physics.workspace = true
auberean-world.workspace = true
dereth-primitives.workspace = true
auberean-script.workspace = true
yalain-content.workspace = true
yalain-net = { workspace = true, features = ["udp", "websocket"] }
yalain-world.workspace = true
yalain-store = { workspace = true, features = ["sqlite"] }
yalain-world-db.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `--hub`: the heartbeat the world posts to a Dereth Network hub, the network's own, as JSON.
dereth-network-protocol.workspace = true
serde_json.workspace = true
# `--federation`: the WebSocket to the hub (the network's own), and the world's half of what goes
# over it.
dereth-network-link.workspace = true
yalain-federation.workspace = true
# `yalain update` and `server.update`: the servers' updater.
dereth-server-update.workspace = true
# The players' friends service, served on TCP beside the login.
yalain-friends.workspace = true
# The settings of its WebSocket endpoint, the game servers' shared one.
dereth-server-websocket.workspace = true
# The operator's character recipes, read from TOML (character files are JSON, with serde_json).
serde.workspace = true
toml.workspace = true
# Ctrl-C and the service manager's stop (SIGTERM): the world keeps everyone in it, then stops.
ctrlc = { workspace = true, features = ["termination"] }
# The keys the network's directory knows the world's allegiances by: random, from the system.
getrandom.workspace = true
# `world fetch`: downloading a world database release over HTTPS (rustls with its bundled web
# roots, no system TLS library) and reading archives other than the release's own.
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
# Tier switch: selects the `live` test binary, which plays our own client against this executable
# on loopback with the September 2013 install's data. It alone turns on the test kit's data
# half, so testing this crate beside the test kit never builds the kit's data binary.
live = ["yalain-testkit/retail-dats"]

[dev-dependencies]
# The Global room's tests send and read the chat service's packets.
auberean-protocol.workspace = true
dereth-protocol.workspace = true
# The updater's tests: a stand-in for a repository's releases on loopback.
dereth-server-update = { workspace = true, features = ["testing"] }
# The updater's tests read a database back.
rusqlite.workspace = true
# The live test's friends streams speak the stream's client half.
auberean-friends.workspace = true
auberean-client-sdk = { workspace = true, features = ["fs"] }
auberean-dat = { workspace = true, features = ["test-support"] }
yalain-content.workspace = true
yalain-testkit.workspace = true
# The live test's stand-in hub takes the world's link as a WebSocket, and the WebSocket endpoint's
# live test is its client, with the frame it carries.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
dereth-transport.workspace = true

[lints]
workspace = true

[[test]]
name = "live"
path = "tests/live/main.rs"
required-features = ["live"]
