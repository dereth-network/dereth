[package]
name = "athenaeum-foundry"
description = "Athenaeum's world machinery: a world's packs over the world database read and checked, built into the server's tables against an install, counted, and edited row by row with undo and redo."
version = "0.1.2" # Athenaeum's own version, shared by its three crates (not the workspace's)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One test target per tier, listed at the bottom; a stray tests/*.rs cannot become another.
autotests = false

[features]
# Tier switch only: no code is gated on it. It selects the `dat` test binary, which reads the
# end-of-retail data files and the world database.
retail-dats = []

[dependencies]
# The pack format and its Asheron's Call 2 dialect: worlds, packs, provenance, the edit session.
dereth-pack.workspace = true
auberean-pack.workspace = true
# The world database: its rows read and checked, merged over a base, compiled into the server's
# tables; and the server's tables themselves.
yalain-world-db.workspace = true
yalain-content.workspace = true
# The install a world is built against.
auberean-dat = { workspace = true, features = ["fs"] }
auberean-assets.workspace = true
# The script library a compile reads saved states with.
auberean-script.workspace = true
# Rows edited in place, their comments and layout kept.
toml_edit.workspace = true
# A record read again after it failed is warned of.
tracing.workspace = true

[dev-dependencies]
auberean-dat = { workspace = true, features = ["fs", "test-support"] }

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]
