# The one clippy configuration for the whole workspace, client, shared and server crates alike.
#
# Transcendental functions go through `dereth_primitives::num::math` (the server reaches the same
# functions as `empyrean_common::math`, a re-export), which gives the same bits on every host;
# `std`'s are the host C runtime's, which differ in the last bit between Windows, Linux and macOS.
# `sqrt`, `powi` and the exact operations stay allowed. Code that is presentation only, or a test
# that uses `std` as a reference on purpose, opts out with an `#[allow(clippy::disallowed_methods)]`
# that says why.
disallowed-methods = [
    { path = "f32::sin", reason = "use dereth_primitives::num::math (the same bits on every host)" },
    { path = "f32::cos", reason = "use dereth_primitives::num::math (the same bits on every host)" },
    { path = "f32::tan", reason = "use dereth_primitives::num::math (the same bits on every host)" },
