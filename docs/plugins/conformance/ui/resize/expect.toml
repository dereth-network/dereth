says = "A window declared resizable takes the size the player gives it, within the bounds it declared (cells wide, lines high), keeps it when the plugin declares the window again, and the plugin hears ui.resized."
[[step]]
after = 1
resize = "main"
width = 100
height = 2
[[step]]
after = 2
resize = "main"
width = 40
height = 12
