says = "An image node shows a PNG from the plugin's package, or one it fetched as an image, by name; a fetched file that is not a PNG fails, and a picture over 1024 pixels a side is not kept, from the package or fetched."
[[step]]
after = 0
bar = "conformance.image"
[scenario]
world = "scripted"
seconds = 1
[net]
"https://maps.example.org/town.png" = "compass.png"
"https://maps.example.org/notes.txt" = "notes.txt"
"https://maps.example.org/wide.png" = "wide.png"
[expect]
status = "running"
console = [
  "the picture wide.png is 1025 by 1 pixels, over 1024 by 1024: it is not shown",
  "fetched\tnet:1",
  "not a picture\tfalse\tthe answer is not a PNG image",
  "too wide\tfalse\tthe picture net:2 is 1025 by 1 pixels, over 1024 by 1024",
]
ui = """window conformance.image main open=true
window #main title="Pictures"
  image #compass height=4 src="compass.png" width=8
  image #map height=4 src="net:1" text="loading" width=8
  image #wide height=4 src="wide.png" text="too wide" width=8
"""
