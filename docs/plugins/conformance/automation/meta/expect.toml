says = "A meta checks its current state's rules on a timer and runs the action of each rule whose condition holds; states change on its actions, and its rules may move the character."
[scenario]
world = "scripted"
seconds = 12
[[object]]
id = 0x80000070
name = "Mosswart"
type = "creature"
place = { ns = 42.25, ew = 33.8 }
[host]
policy_document = """policy_version = 1
[automation]
default = "allow"
"""
[expect]
status = "running"
console = ["state	Idle	->	Approach", "reached	true	true", "state	Approach	->	Done"]
moves = ["autorun on", "autorun off"]
