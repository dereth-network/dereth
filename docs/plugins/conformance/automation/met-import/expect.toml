says = "A VTank meta file imports as a meta checked in VTank's order: the first true rule of its state runs; its expressions, options, embedded route and meta view work, and what it could not carry is listed."
[scenario]
world = "scripted"
seconds = 10
[host]
policy_document = """policy_version = 1
[automation]
default = "allow"
"""
[[step]]
after = 8
click = "view:Remote.c1:Go"
[expect]
status = "running"
console = ["unsupported	condition dialog_popup", "option	enablecombat	false", "state	Default	->	Walk", "state	Walk	->	Walking", "state	Walking	->	Arrived", "state	Arrived	->	Clicked", "state	Clicked	->	Done"]
printed = [
    "[Conformance: met-import] unsupported condition dialog_popup",
    "[Plugins] Conformance: met-import loaded.",
    "[Conformance: met-import] option enablecombat false",
    "[Conformance: met-import] state Default -> Walk",
    "[Conformance: met-import] state Walk -> Walking",
    "arrived",
    "[Conformance: met-import] state Walking -> Arrived",
    "[Conformance: met-import] state Arrived -> Clicked",
    "clicked",
    "[Conformance: met-import] state Clicked -> Done",
]
