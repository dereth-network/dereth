says = "A script hears UtilityBelt's events over the plugin interface's: objects coming and going, the selection, a container opened with its items, a tell, speech and an emote with the speaker and the words, a line eaten, a handler that waits while the next is heard, Once and Until, and the world's tick."

[scenario]
world = "scripted"
seconds = 12

[[object]]
id = 0x80000041
name = "Corpse of Drudge"
type = "container"
corpse = true
place = { ns = 42.2, ew = 33.8 }

[[object]]
id = 0x80000042
name = "Pyreal Scarab"
type = "spell_component"
container = 0x80000041

[[step]]
after = 1
spawn = [{ id = 0x80000051, name = "Drudge Skulker", type = "creature", place = { ns = 42.21, ew = 33.8 } }]

[[step]]
after = 2
select = 0x80000051

[[step]]
after = 3
hear = { kind = "tell", from = "Bob", id = 0x50000002, text = "hello" }

[[step]]
after = 3.5
hear = { kind = "tell", from = "Bob", id = 0x50000002, text = "wait" }

[[step]]
after = 4
hear = { kind = "tell", from = "Bob", id = 0x50000002, text = "stop" }

[[step]]
after = 5
hear = { kind = "tell", from = "Bob", id = 0x50000002, text = "hush" }

[[step]]
after = 6
hear = { kind = "say", from = "Carl", id = 0x50000003, text = "hi all" }

[[step]]
after = 7
hear = { kind = "emote", from = "Carl", id = 0x50000003, text = "waves" }

[[step]]
after = 8
remove = 0x80000051

[expect]
status = "running"
console = ["created Drudge Skulker Monster", "selected 0x80000051 Drudge Skulker", "tell Bob hello Tell 0x50000002", "once hello", "until hello", "tell Bob wait Tell 0x50000002", "until wait", "tell Bob stop Tell 0x50000002", "until stop", "waited wait", "tell Bob hush Tell 0x50000002", "local Carl hi all", "emote Carl waves", "released 0x80000051", "lines 6 true", "opened Corpse of Drudge 1"]
hidden = ['<Tell:IIDString:1342177282:Bob>Bob<\Tell> tells you, "hush"']
