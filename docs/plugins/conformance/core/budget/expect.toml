says = "A handler that runs past its time budget is stopped, and a plugin that does so three times within a minute is suspended."
[[step]]
after = 1
say = "/nothing"
[expect]
status = "suspended"
printed = [
    "[Plugins] Conformance: budget loaded.",
    "[Plugins] Conformance: budget: stopped: over its time budget: runtime error: the plugin ran past its time budget",
    "[Plugins] Conformance: budget: stopped: over its time budget: runtime error: the plugin ran past its time budget",
    "[Plugins] Conformance: budget: stopped: over its time budget: runtime error: the plugin ran past its time budget",
    "[Plugins] conformance.budget was suspended (over its time budget 3 times within a minute). /plugin reload conformance.budget starts it again.",
]
