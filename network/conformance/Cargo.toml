[package]
name = "dereth-network-conformance"
description = "The Dereth Network's conformance suite: the vectors every implementation agrees on, the checks any hub must pass over its WebSocket, and the checks any world must pass with the suite playing the hub."
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
publish = false

# Everything under network/ names its own versions rather than the workspace's, so that the folder
# can become a repository of its own unchanged.
[dependencies]
dereth-network-protocol = { path = "../protocol" }
serde_json = "1"
# The hub checks hold real links: the WebSocket client.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
cast_possible_truncation = "warn"

[[bin]]
name = "dereth-network-conformance"
path = "src/main.rs"
