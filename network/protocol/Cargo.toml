[package]
name = "dereth-network-protocol"
description = "The Dereth Network's world-to-hub protocol: addresses, settings, the text rules, stand-in ids, rate limits and the link messages, with no I/O."
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT AND Unicode-3.0"
publish = false

# Everything under network/ names its own versions rather than the workspace's, so that the folder
# can become a repository of its own unchanged.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
cast_possible_truncation = "warn"
