# cargo-about's configuration for the hub's THIRD-PARTY-LICENSES.html (the release workflow runs it
# once per target). The licences a crate linked into the hub may carry; a crate under any other
# licence, or one whose licence text cannot be found, fails the release.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# What is linked into the binaries: not the build scripts' or the tests' dependencies.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The network's own crates (the hub, AGPL-3.0-only, and the protocol, MIT) are not third-party:
# their licences are LICENSE and LICENSE-protocol.
private = { ignore = true }
