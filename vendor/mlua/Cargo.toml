[package]
edition = "2024"
rust-version = "1.88"
name = "mlua"
version = "0.12.1"
authors = [
    "Aleksandr Orlenko <zxteam@pm.me>",
    "kyren <catherine@kyju.org>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
High level bindings to Lua 5.5/5.4/5.3/5.2/5.1 (including LuaJIT) and Luau
with async/await features and support of writing native Lua modules in Rust.
"""
documentation = "https://docs.rs/mlua"
readme = "README.md"
keywords = [
    "lua",
    "luajit",
    "luau",
    "async",
    "scripting",
]
categories = [
    "api-bindings",
    "asynchronous",
]
license = "MIT"
repository = "https://github.com/mlua-rs/mlua"

[package.metadata.docs.rs]
features = [
    "lua55",
    "vendored",
    "async",
    "send",
    "serde",
    "macros",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
anyhow = [
    "dep:anyhow",
    "error-send",
]
async = ["dep:futures-util"]
error-send = []
lua51 = ["ffi/lua51"]
lua52 = ["ffi/lua52"]
lua53 = ["ffi/lua53"]
lua54 = ["ffi/lua54"]
lua55 = ["ffi/lua55"]
luajit = ["ffi/luajit"]
luajit52 = [
    "luajit",
    "ffi/luajit52",
]
luau = ["ffi/luau"]
luau-jit = [
    "luau",
    "ffi/luau-codegen",
]
luau-vector4 = [
    "luau",
    "ffi/luau-vector4",
]
macros = [
    "mlua_derive/macros",
    "dep:inventory",
]
module = [
    "mlua_derive",
    "ffi/module",
]
send = ["error-send"]
serde = [
    "dep:serde",
    "dep:erased-serde",
    "dep:serde-value",
    "bstr/serde",
]
serialize = ["serde"]
userdata-wrappers = ["parking_lot/send_guard"]
vendored = ["ffi/vendored"]

[lib]
name = "mlua"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1.0"
optional = true

[dependencies.bstr]
version = "1.0"
features = ["std"]
default-features = false

[dependencies.either]
version = "1.0"

[dependencies.erased-serde]
version = "0.4"
optional = true

[dependencies.ffi]
version = "0.12.0"
package = "mlua-sys"

[dependencies.futures-util]
version = "0.3"
features = ["std"]
optional = true
default-features = false

[dependencies.inventory]
version = "0.3"
optional = true

[dependencies.libc]
version = "0.2"

[dependencies.mlua_derive]
version = "=0.12.1"
optional = true

[dependencies.num-traits]
version = "0.2.14"

[dependencies.parking_lot]
version = "0.12"
features = ["arc_lock"]

[dependencies.rustc-hash]
version = "2.0"

[dependencies.serde]
version = "1.0"
optional = true

[dependencies.serde-value]
version = "0.7"
optional = true

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(tarpaulin_include)",
    "cfg(force_memory_limit)",
]
