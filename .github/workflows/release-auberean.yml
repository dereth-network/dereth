name: Release Auberean

# Builds, checks and drafts an Auberean release: the launcher, with the Asheron's Call 2 client
# beside it, for Windows, macOS and Linux. A pushed `auberean-v<version>` tag builds every target
# and creates a DRAFT GitHub release, which a maintainer reviews and publishes by hand. Running it
# by hand (workflow_dispatch) is a dry run: the same builds and checks, the release files kept as a
# workflow artifact for 7 days, nothing published.
#
# The launcher is Dereth's own, at its own version: every job runs `cargo xtask package auberean`,
# which builds the launcher exactly as `cargo xtask package dereth` does (the same configuration
# and environment, from this commit, with Dereth's client and tool as that build's inputs and
# MoltenVK on macOS), then takes Dereth's client out and puts the Auberean client and
# launcher-defaults.json beside the launcher. The defaults file opens a first run in Auberean's
# realm and takes the launcher's updates from the newest published `auberean-v<version>` release's
# latest.json, whose version names the launcher and the client it carries
# (`<launcher>+auberean.<client>`). A launcher never updates to an older launcher than itself
# (auberean/RELEASING.md).
#
# The release's description starts with its notes, which `cargo xtask release-notes auberean`
# writes from the tagged tree: the release's section of auberean/CHANGES.md, then the client's
# commits since the previous auberean-v tag, grouped. A dry run writes the notes the next release
# would get.

on:
  push:
    tags: ['auberean-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-auberean-${{ github.ref }}
  cancel-in-progress: false

env:
  # The build tools, pinned: the same as Dereth's release, so the launcher is built the same way.
  CARGO_ABOUT_VERSION: 0.9.2
  TAURI_CLI_VERSION: 2.12.0
  # MoltenVK, which the launcher's macOS build takes in as Dereth's does: pinned by its checksum.
  MOLTENVK_URL: https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-macos.tar
  MOLTENVK_SHA256: f95765a6229cb7b915990a2890ce12ebe36a730b021545d3d52ae69ce4c4024e
  # The Linux AppImage's packer and the runtime it embeds, pinned by their checksums: the launcher's
  # AppImage is unpacked and packed again with the client in it.
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
  # Where the release files are downloaded from, the repository whose releases the launcher
  # updates from, and the source the notices name: this repository, as in Dereth's release.
  DERETH_BUILD_SOURCE_URL: https://github.com/${{ github.repository }}
  AUBEREAN_BUILD_SOURCE_URL: https://github.com/${{ github.repository }}

jobs:
  version:
    name: version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      launcher: ${{ steps.version.outputs.launcher }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the workspace Rust version
        shell: bash
        run: |
          toolchain=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustup override set "$toolchain"
      - name: The tag names the version the client carries, on main; the launcher's is its own
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(cargo xtask version auberean --tag "$GITHUB_REF_NAME")
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main"
              exit 1
            fi
          else
            version=$(cargo xtask version auberean)
          fi
          launcher=$(cargo xtask version dereth)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "launcher=$launcher" >> "$GITHUB_OUTPUT"
          echo "Auberean $version, with the launcher $launcher"
      - name: The release notes, from CHANGES.md and the commits since the previous release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            cargo xtask release-notes auberean --version "$VERSION" --out target/release-notes.md
          else
            cargo xtask release-notes auberean --out target/release-notes.md
          fi
          cat target/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes-auberean
          path: target/release-notes.md
          if-no-files-found: error
          retention-days: 7

  package:
    name: package (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # Ubuntu 22.04's glibc (2.35) is the oldest a Linux release runs on.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The build number is the commit count.
          fetch-depth: 0
      - name: Install the workspace Rust version and the target
        run: |
          toolchain=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --target ${{ matrix.target }}
          rustup override set "$toolchain"
      - name: Install the Linux build dependencies (the web view, the AppImage tools, ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libasound2-dev build-essential pkg-config curl wget file patchelf
      - name: Fetch appimagetool and the AppImage runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/appimage-runtime" "$APPIMAGE_RUNTIME_URL"
          echo "$APPIMAGE_RUNTIME_SHA256  $RUNNER_TEMP/appimage-runtime" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/appimage-runtime" >> "$GITHUB_ENV"
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path dereth/launcher/Cargo.toml
      - name: Install cargo-about and the Tauri CLI
        run: |
          cargo install --locked "cargo-about@$CARGO_ABOUT_VERSION" --features cli
          cargo install --locked "tauri-cli@$TAURI_CLI_VERSION"
      - name: Fetch MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/MoltenVK-macos.tar" "$MOLTENVK_URL"
          echo "$MOLTENVK_SHA256  $RUNNER_TEMP/MoltenVK-macos.tar" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/MoltenVK-macos.tar" -C "$RUNNER_TEMP"
          echo "DERETH_MOLTENVK_DIR=$RUNNER_TEMP/MoltenVK" >> "$GITHUB_ENV"
      - name: cargo xtask package auberean
        env:
          # The launcher's update-signing key, the same as Dereth's release signs with. Without it
          # the files are built unsigned and no latest.json is written, which a tag refuses below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo xtask package auberean --target ${{ matrix.target }} --out dist
      - name: A release is signed
        if: github.ref_type == 'tag'
        run: |
          if ! ls dist/latest-*.json > /dev/null 2>&1; then
            echo "::error::the release file is not signed for the launcher's updates: set the TAURI_SIGNING_PRIVATE_KEY secret"
            exit 1
          fi
      - name: Smoke-run the packaged programs
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
          LAUNCHER: ${{ needs.version.outputs.launcher }}
        run: |
          mkdir smoke
          run() { "$@"; }
          case "$TARGET" in
            x86_64-apple-darwin)
              if arch -x86_64 /usr/bin/true 2> /dev/null; then
                run() { arch -x86_64 "$@"; }
              else
                echo "::notice::no Rosetta on this runner: $TARGET is checked by its headers only"
                exit 0
              fi ;;
          esac
          case "$TARGET" in
            *windows*)
              (cd smoke && 7z x "../dist/auberean-$VERSION-windows-x86_64.zip" > /dev/null)
              dir="smoke/auberean-$VERSION"
              launcher="$dir/dereth.exe"
              client="$dir/auberean.exe"
              defaults="$dir/launcher-defaults.json"
              dereth_client="$dir/dereth-client.exe" ;;
            *linux*)
              appimage="$PWD/dist/Auberean-$VERSION-linux-x86_64.AppImage"
              (cd smoke && "$appimage" --appimage-extract > /dev/null)
              launcher="smoke/squashfs-root/usr/bin/dereth"
              client="smoke/squashfs-root/usr/bin/auberean"
              defaults="smoke/squashfs-root/usr/bin/launcher-defaults.json"
              dereth_client="smoke/squashfs-root/usr/bin/dereth-client" ;;
            *apple*)
              arch=${TARGET%%-*}
              tar -xzf "dist/Auberean-$VERSION-macos-$arch.app.tar.gz" -C smoke
              codesign --verify --deep --strict smoke/Dereth.app
              launcher="smoke/Dereth.app/Contents/MacOS/dereth"
              client="smoke/Dereth.app/Contents/MacOS/auberean"
              defaults="smoke/Dereth.app/Contents/Resources/launcher-defaults.json"
              dereth_client="smoke/Dereth.app/Contents/MacOS/dereth-client" ;;
          esac
          # The same launcher as Dereth's release, at its own version.
          run "$launcher" --version | tee version-launcher.txt
          grep -qx "dereth $LAUNCHER" version-launcher.txt
          grep -qx "target: $TARGET" version-launcher.txt
          run "$client" --version | tee version-client.txt
          grep -qx "auberean $VERSION" version-client.txt
          grep -qx "target: $TARGET" version-client.txt
          # A first run opens in Auberean's realm, and updates come from Auberean's releases.
          grep -q '"realm": "auberean"' "$defaults"
          grep -q '"updates": "auberean"' "$defaults"
          # Dereth's client is fetched when it is wanted, not carried.
          test ! -e "$dereth_client"
          echo "::notice::the launcher has no headless mode, so its window is not opened here"
      - name: Keep this target's files (the index is written by the gather job)
        run: rm -f dist/SHA256SUMS dist/MANIFEST.txt dist/release.json dist/latest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auberean-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  gather:
    name: gather the release
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the workspace Rust version
        run: |
          toolchain=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustup override set "$toolchain"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: auberean-*
          path: dist
          merge-multiple: true
      # Scans every file again, verifies every update signature, and writes MANIFEST.txt,
      # release.json, latest.json and SHA256SUMS over them.
      - name: cargo xtask package auberean --gather
        run: cargo xtask package auberean --gather dist
      - name: A release has its latest.json
        if: github.ref_type == 'tag'
        run: test -s dist/latest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-auberean-${{ needs.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
            dist/SHA256SUMS
            dist/MANIFEST.txt
            dist/release.json
            dist/latest.json
          if-no-files-found: error
          retention-days: 7

  draft:
    name: draft the GitHub release
    if: github.ref_type == 'tag'
    needs: [version, gather]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-auberean-${{ needs.version.outputs.version }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes-auberean
          path: notes
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          LAUNCHER: ${{ needs.version.outputs.launcher }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          # The notes first (highlights, then all changes), then how to install.
          cp ../notes/release-notes.md ../notes.md
          cat >> ../notes.md <<EOF

          ## Downloads

          Auberean $VERSION, with the Dereth Network launcher $LAUNCHER, for Windows (10 or newer, x86-64), macOS (11 or newer, Apple silicon and Intel) and Linux (x86-64, glibc 2.35 or newer: Ubuntu 22.04 and later).

          | system | download | |
          |---|---|---|
          | Windows | \`auberean-$VERSION-windows-x86_64.zip\` | unzip anywhere and run \`dereth.exe\`; no installer |
          | macOS | \`Auberean-$VERSION-macos-aarch64.app.tar.gz\` (Apple silicon), \`-x86_64\` (Intel) | unpack and move \`Dereth.app\` to Applications |
          | Linux | \`Auberean-$VERSION-linux-x86_64.AppImage\` | mark it executable and run it |

          The launcher opens in Auberean's realm and keeps itself and the client up to date from this repository's newest Auberean release. It is the same launcher as Dereth's: Dereth's realm is one click away, and its client, Yalain and Athenaeum download when you first want them.

          **No game data is included**: the client plays with the data files of your own Asheron's Call 2 install.

          These builds are not code-signed yet. Windows SmartScreen asks once (More info, then Run anyway); macOS asks once (System Settings, Privacy & Security, Open Anyway).

          Verifying a download: \`sha256sum -c SHA256SUMS --ignore-missing\`
          EOF
          # Every file gets a display label, computed from its platform; the file names stay as
          # they are. A file with no label fails the job, so a new target cannot go unlabelled.
          assets=()
          unlabelled=()
          for f in *; do
            label=""
            case "$f" in
              SHA256SUMS) label="Checksums (SHA-256)" ;;
              MANIFEST.txt) label="Release manifest" ;;
              release.json) label="Release facts (JSON)" ;;
              latest.json) label="Updater manifest" ;;
              "auberean-$VERSION-"*)
                case "${f#"auberean-$VERSION-"}" in
                  windows-x86_64.zip) label="Auberean · Windows x64 (zip, no installer)" ;;
                esac ;;
              "Auberean-$VERSION-"*)
                case "${f#"Auberean-$VERSION-"}" in
                  macos-aarch64.app.tar.gz) label="Auberean · macOS Apple silicon" ;;
                  macos-x86_64.app.tar.gz) label="Auberean · macOS Intel" ;;
                  linux-x86_64.AppImage) label="Auberean · Linux x86-64 AppImage (glibc 2.35+)" ;;
                esac ;;
            esac
            if [ -n "$label" ]; then
              assets+=("$f#$label")
              echo "$f: $label"
            else
              unlabelled+=("$f")
            fi
          done
          if [ ${#unlabelled[@]} -gt 0 ]; then
            echo "::error::no label for ${unlabelled[*]}"
            exit 1
          fi
          PRE=""
          # A pre-release version carries a suffix (`0.2.0-rc.1`); the tag always holds a hyphen.
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          # Dereth's release stays the repository's "Latest".
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --latest=false $PRE \
            --title "Auberean $VERSION" --notes-file ../notes.md \
            "${assets[@]}"
