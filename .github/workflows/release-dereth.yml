name: Release Dereth

# Builds, checks and drafts a Dereth release: the launcher, with the client inside it, for
# Windows, macOS and Linux. A pushed `dereth-v<version>` tag builds every
# target and creates a DRAFT GitHub release, which a maintainer reviews and publishes by hand. The
# launcher updates itself from the latest.json of the repository's newest published
# `dereth-v<version>` release (a pre-release excepted), which it finds by listing the releases.
# Running it by hand (workflow_dispatch) is a dry run: the same builds and checks,
# the release files kept as a workflow artifact for 7 days, nothing published.
#
# Every job runs `cargo xtask package dereth`, the same command a contributor runs locally
# (dereth/launcher/RELEASING.md). The CI workflow runs tier 0 on the tagged commit as on every
# push.
#
# The release's description starts with its notes, which `cargo xtask release-notes dereth` writes
# from the tagged tree: the release's section of dereth/CHANGES.md, then the client's commits since
# the previous dereth-v tag, grouped. A dry run writes the notes the next release would get.

on:
  push:
    tags: ['dereth-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dereth-${{ github.ref }}
  cancel-in-progress: false

env:
  # The build tools, pinned.
  CARGO_ABOUT_VERSION: 0.9.2
  TAURI_CLI_VERSION: 2.12.0
  # MoltenVK for the macOS bundles: KhronosGroup's macOS release, pinned by its checksum.
  MOLTENVK_URL: https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-macos.tar
  MOLTENVK_SHA256: f95765a6229cb7b915990a2890ce12ebe36a730b021545d3d52ae69ce4c4024e
  # Where the release files are downloaded from, the source the notices name, and the repository
  # whose releases the launcher updates from: this repository.
  DERETH_BUILD_SOURCE_URL: https://github.com/${{ github.repository }}

jobs:
  version:
    name: version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the workspace Rust version
        shell: bash
        run: |
          toolchain=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustup override set "$toolchain"
      - name: The tag names the version the client and the launcher carry, on main
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(cargo xtask version dereth --tag "$GITHUB_REF_NAME")
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main"
              exit 1
            fi
          else
            version=$(cargo xtask version dereth)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Dereth $version"
      - name: The release notes, from CHANGES.md and the commits since the previous release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            cargo xtask release-notes dereth --version "$VERSION" --out target/release-notes.md
          else
            cargo xtask release-notes dereth --out target/release-notes.md
          fi
          cat target/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes-dereth
          path: target/release-notes.md
          if-no-files-found: error
          retention-days: 7

  package:
    name: package (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # Ubuntu 22.04's glibc (2.35) is the oldest a Linux release runs on.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The build number is the commit count.
          fetch-depth: 0
      - name: Install the workspace Rust version and the target
        run: |
          toolchain=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --target ${{ matrix.target }}
          rustup override set "$toolchain"
      - name: Install the Linux build dependencies (the web view, the AppImage tools, ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libasound2-dev build-essential pkg-config curl wget file patchelf
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path dereth/launcher/Cargo.toml
      - name: Install cargo-about and the Tauri CLI
        run: |
          cargo install --locked "cargo-about@$CARGO_ABOUT_VERSION" --features cli
          cargo install --locked "tauri-cli@$TAURI_CLI_VERSION"
      - name: Fetch MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/MoltenVK-macos.tar" "$MOLTENVK_URL"
          echo "$MOLTENVK_SHA256  $RUNNER_TEMP/MoltenVK-macos.tar" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/MoltenVK-macos.tar" -C "$RUNNER_TEMP"
          echo "DERETH_MOLTENVK_DIR=$RUNNER_TEMP/MoltenVK" >> "$GITHUB_ENV"
      - name: cargo xtask package dereth
        env:
          # The launcher's update-signing key. Without it the files are built unsigned and no
          # latest.json is written, which a tag refuses below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo xtask package dereth --target ${{ matrix.target }} --out dist
      - name: A release is signed
        if: github.ref_type == 'tag'
        run: |
          if ! ls dist/latest-*.json > /dev/null 2>&1; then
            echo "::error::the launcher's update file is not signed: set the TAURI_SIGNING_PRIVATE_KEY secret"
            exit 1
          fi
      - name: Smoke-run the packaged programs
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir smoke
          run() { "$@"; }
          case "$TARGET" in
            x86_64-apple-darwin)
              if arch -x86_64 /usr/bin/true 2> /dev/null; then
                run() { arch -x86_64 "$@"; }
              else
                echo "::notice::no Rosetta on this runner: $TARGET is checked by its headers only"
                exit 0
              fi ;;
          esac
          case "$TARGET" in
            *windows*)
              (cd smoke && 7z x "../dist/dereth-$VERSION-windows-x86_64.zip" > /dev/null)
              launcher="smoke/dereth-$VERSION/dereth.exe"
              client="smoke/dereth-$VERSION/dereth-client.exe" ;;
            *linux*)
              appimage="$PWD/dist/Dereth-$VERSION-linux-x86_64.AppImage"
              (cd smoke && "$appimage" --appimage-extract > /dev/null)
              launcher="smoke/squashfs-root/usr/bin/dereth"
              client="smoke/squashfs-root/usr/bin/dereth-client" ;;
            *apple*)
              arch=${TARGET%%-*}
              tar -xzf "dist/Dereth-$VERSION-macos-$arch.app.tar.gz" -C smoke
              codesign --verify --deep --strict smoke/Dereth.app
              launcher="smoke/Dereth.app/Contents/MacOS/dereth"
              client="smoke/Dereth.app/Contents/MacOS/dereth-client" ;;
          esac
          run "$launcher" --version | tee version-launcher.txt
          grep -qx "dereth $VERSION" version-launcher.txt
          grep -qx "target: $TARGET" version-launcher.txt
          run "$client" --version | tee version-client.txt
          grep -qx "dereth-client $VERSION" version-client.txt
          grep -qx "target: $TARGET" version-client.txt
          echo "::notice::the launcher has no headless mode, so its window is not opened here"
      - name: Keep this target's files (the index is written by the gather job)
        run: rm -f dist/SHA256SUMS dist/MANIFEST.txt dist/release.json dist/latest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dereth-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  gather:
    name: gather the release
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the workspace Rust version
        run: |
          toolchain=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustup override set "$toolchain"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dereth-*
          path: dist
          merge-multiple: true
      # Scans every file again, verifies every update signature, and writes MANIFEST.txt,
      # release.json, latest.json and SHA256SUMS over them.
      - name: cargo xtask package dereth --gather
        run: cargo xtask package dereth --gather dist
      - name: A release has its latest.json
        if: github.ref_type == 'tag'
        run: test -s dist/latest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dereth-${{ needs.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
            dist/SHA256SUMS
            dist/MANIFEST.txt
            dist/release.json
            dist/latest.json
          if-no-files-found: error
          retention-days: 7

  draft:
    name: draft the GitHub release
    if: github.ref_type == 'tag'
    needs: [version, gather]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dereth-${{ needs.version.outputs.version }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes-dereth
          path: notes
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          # The notes first (highlights, then all changes), then how to install.
          cp ../notes/release-notes.md ../notes.md
          cat >> ../notes.md <<EOF

          ## Downloads

          Dereth $VERSION: the launcher, with the Dereth client inside it, for Windows (10 or newer, x86-64), macOS (11 or newer, Apple silicon and Intel) and Linux (x86-64, glibc 2.35 or newer: Ubuntu 22.04 and later).

          | system | download | |
          |---|---|---|
          | Windows | \`dereth-$VERSION-windows-x86_64.zip\` | unzip anywhere and run \`dereth.exe\`; no installer |
          | macOS | \`Dereth-$VERSION-macos-aarch64.app.tar.gz\` (Apple silicon), \`-x86_64\` (Intel) | unpack and move \`Dereth.app\` to Applications |
          | Linux | \`Dereth-$VERSION-linux-x86_64.AppImage\` | mark it executable and run it |

          The launcher keeps itself and the client up to date from this repository's newest Dereth release.

          **No game data is included**: the client plays with the data files of your own Asheron's Call install.

          These builds are not code-signed yet. Windows SmartScreen asks once (More info, then Run anyway); macOS asks once (System Settings, Privacy & Security, Open Anyway).

          Verifying a download: \`sha256sum -c SHA256SUMS --ignore-missing\`
          EOF
          # Every file gets a display label, computed from its platform; the file names stay as
          # they are. A file with no label fails the job, so a new target cannot go unlabelled.
          assets=()
          unlabelled=()
          for f in *; do
            label=""
            case "$f" in
              SHA256SUMS) label="Checksums (SHA-256)" ;;
              MANIFEST.txt) label="Release manifest" ;;
              release.json) label="Release facts (JSON)" ;;
              latest.json) label="Updater manifest" ;;
              "dereth-$VERSION-"*)
                case "${f#"dereth-$VERSION-"}" in
                  windows-x86_64.zip) label="Dereth · Windows x64 (zip, no installer)" ;;
                esac ;;
              "Dereth-$VERSION-"*)
                case "${f#"Dereth-$VERSION-"}" in
                  macos-aarch64.app.tar.gz) label="Dereth · macOS Apple silicon" ;;
                  macos-x86_64.app.tar.gz) label="Dereth · macOS Intel" ;;
                  linux-x86_64.AppImage) label="Dereth · Linux x86-64 AppImage (glibc 2.35+)" ;;
                esac ;;
            esac
            if [ -n "$label" ]; then
              assets+=("$f#$label")
              echo "$f: $label"
            else
              unlabelled+=("$f")
            fi
          done
          if [ ${#unlabelled[@]} -gt 0 ]; then
            echo "::error::no label for ${unlabelled[*]}"
            exit 1
          fi
          PRE=""
          # A pre-release version carries a suffix (`0.2.0-rc.1`); the tag always holds a hyphen.
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag $PRE \
            --title "Dereth $VERSION" --notes-file ../notes.md \
            "${assets[@]}"
