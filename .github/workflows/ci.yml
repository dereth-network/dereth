name: CI

on:
  # Branches only: a pushed tag names a commit CI has already run on, and the release workflow
  # checks the tagged commit itself.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The build, the tests and clippy, on every system: each compiles code the others do not. The
  # rules and the docs read the same source everywhere and run once, in `rules`. Each part is a step
  # of its own, so its time can be read from the run's steps, and each runs whatever the one before
  # it did: one run reports everything that is wrong.
  tier0:
    name: tier0 (${{ matrix.os }})
    strategy:
      # Every platform reports, even when another fails.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A run that hits the limit tells nothing and saves nothing, so the limit is well past the
    # slowest system's time: only a hang should reach it. `cargo xtask ship` waits at least this.
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      # Incremental builds cannot be cached, and a fresh checkout has nothing to build on.
      CARGO_INCREMENTAL: '0'
      # sccache keeps a run's compiled libraries in the Actions cache as they are built, even when
      # the run is later cancelled. RUSTC_WRAPPER is set below, only once it has started.
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_RW_MODE: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preflight') && 'READ_WRITE' || 'READ_ONLY' }}
      # If its server dies mid-run, compile without it rather than fail.
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history and its tags: a release's upgrade declaration is checked against the
          # previous release's tag, and the build number is the commit count.
          fetch-depth: 0
      - name: Install the Linux build inputs
        if: runner.os == 'Linux'
        # ALSA for the audio output (cpal) and pkg-config to find it; the README's platform table.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Install the workspace Rust version
        run: |
          # `[workspace.package] rust-version`, the one `rust-version = "..."` line in Cargo.toml.
          $found = Select-String -Path Cargo.toml -Pattern '^rust-version\s*=\s*"([^"]+)"'
          if (@($found).Count -ne 1) { Write-Error "Cargo.toml must hold exactly one rust-version line"; exit 1 }
          $toolchain = $found.Matches[0].Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set $toolchain
      # The dependencies' builds and the registry, kept between runs, one cache for each system.
      # Runs on main save theirs; a run on any other branch restores main's and saves nothing. After
      # the toolchain: its version is part of the key.
      - name: The dependencies' builds from earlier runs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The workspace's own libraries, which the cache above leaves out. An optional extra: when the
      # action or the cache service fails, the build goes on without it and only takes longer.
      - name: Install sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
          # Its closing report can fail a job; the step below says the same and cannot.
          disable_annotations: true
      - name: Use sccache if it starts
        if: steps.sccache.outcome == 'success'
        continue-on-error: true
        run: |
          sccache --start-server
          if ($LASTEXITCODE -eq 0) {
            "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
          } else {
            Write-Output "::warning::sccache did not start; building without it"
          }
          exit 0
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Build
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo xtask ci tier0 --only build
      - name: Tests
        if: ${{ !cancelled() }}
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo xtask ci tier0 --only test
      - name: Clippy
        if: ${{ !cancelled() }}
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo xtask ci tier0 --only clippy
      - name: How sccache did
        if: ${{ !cancelled() && steps.sccache.outcome == 'success' }}
        continue-on-error: true
        run: |
          sccache --show-stats
          $s = (sccache --show-stats --stats-format=json | ConvertFrom-Json).stats
          Write-Output "::notice title=sccache::hits $($s.cache_hits.counts.Rust), misses $($s.cache_misses.counts.Rust), errors $($s.cache_errors.counts.Rust), not cacheable $($s.requests_not_cacheable)"
          exit 0

  # The rules and the docs: what reads the source and comes out the same on every system, run once.
  # `cargo xtask ci tier0` still runs them everywhere it is typed. The docs of code that only another
  # system compiles are not checked here: .forgejo/workflows/landed.yml checks them on each system.
  rules:
    name: rules and docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: '0'
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_RW_MODE: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preflight') && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the Linux build inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Install the workspace Rust version
        run: |
          $found = Select-String -Path Cargo.toml -Pattern '^rust-version\s*=\s*"([^"]+)"'
          if (@($found).Count -ne 1) { Write-Error "Cargo.toml must hold exactly one rust-version line"; exit 1 }
          $toolchain = $found.Matches[0].Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set $toolchain
      - name: Install sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
          # Its closing report can fail a job; the step below says the same and cannot.
          disable_annotations: true
      - name: Use sccache if it starts
        if: steps.sccache.outcome == 'success'
        continue-on-error: true
        run: |
          sccache --start-server
          if ($LASTEXITCODE -eq 0) {
            "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
          } else {
            Write-Output "::warning::sccache did not start; building without it"
          }
          exit 0
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Rules
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo xtask ci tier0 --only rules
      - name: Docs
        if: ${{ !cancelled() }}
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo xtask ci tier0 --only docs
      - name: How sccache did
        if: ${{ !cancelled() && steps.sccache.outcome == 'success' }}
        continue-on-error: true
        run: |
          sccache --show-stats
          $s = (sccache --show-stats --stats-format=json | ConvertFrom-Json).stats
          Write-Output "::notice title=sccache::hits $($s.cache_hits.counts.Rust), misses $($s.cache_misses.counts.Rust), errors $($s.cache_errors.counts.Rust), not cacheable $($s.requests_not_cacheable)"
          exit 0

  # The Dereth Network (network/): its crates' tests and the conformance vectors through the suite's
  # own binary, then the ACE mod built with .NET 10 against a pinned ACE release and checked by its
  # harness (the vectors, its units, the link client and the world half against this commit's hub on
  # loopback, every ACE method it patches resolved and bound) and by applying every patch with ACE's
  # own Harmony. Windows also checks the mod's text rules against Windows' own conversion.
  network:
    name: network (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # The ACE release the mod is built and checked against, pinned by its digest (the release
      # workflow's).
      ACE_VERSION: v1.78.4816
      ACE_SHA256: fc79656f767dbfa12f8edd9d690ac787792182ca34fbb8eb2dbbdea2c60110a6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the workspace Rust version
        run: |
          toolchain=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustup override set "$toolchain"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: The network's crates, and the conformance vectors through the suite's binary
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          cargo test --locked --profile test-release -p dereth-network-protocol -p dereth-network-hub -p dereth-network-conformance
          cargo build --locked --profile test-release -p dereth-network-hub -p dereth-network-conformance --bins
          target/test-release/dereth-network-conformance vectors
      - name: ACE's assemblies (the pinned release)
        run: |
          mkdir -p target/ace-server
          curl -fsSL -o target/ace.zip "https://github.com/ACEmulator/ACE/releases/download/$ACE_VERSION/ACE.Server-$ACE_VERSION.zip"
          echo "$ACE_SHA256  target/ace.zip" | sha256sum -c -
          case "$RUNNER_OS" in
            Windows) 7z x -y -otarget/ace-server target/ace.zip > /dev/null ;;
            *) unzip -q target/ace.zip -d target/ace-server ;;
          esac
          test -f target/ace-server/ACE.Server.dll
      - name: The ACE mod, its harness, and every patch applied
        working-directory: network/ace-mod
        run: |
          ace="$GITHUB_WORKSPACE/target/ace-server"
          exe=""; skip=()
          # Windows' own best-fit conversion is checked on Windows only.
          case "$RUNNER_OS" in Windows) exe=".exe" ;; *) skip=(--skip units) ;; esac
          dotnet build Dereth.Network/Dereth.Network.csproj -c Release -p:AceDirectory="$ace"
          dotnet build tests/Harness.csproj -c Release
          dotnet build tests/PatchApply/PatchApply.csproj -c Release -p:AceDirectory="$ace"
          mod=../../target/ace-mod/bin/Dereth.Network/release/Dereth.Network.dll
          dotnet ../../target/ace-mod/bin/Harness/release/Dereth.Network.Harness.dll \
            --vectors ../conformance/vectors --hub "../../target/test-release/dereth-network-hub$exe" \
            --ace "$ace" --mod "$mod" "${skip[@]}"
          dotnet ../../target/ace-mod/bin/PatchApply/release/Dereth.Network.PatchApply.dll --ace "$ace" --mod "$mod"

  # The web client's WebAssembly build. Tier 0 builds and tests its platform-neutral half on every
  # platform; this builds the half only a browser runs, lints it, and makes the release bundle the
  # release workflow makes, with its deny scan and manifest. No game data: the bundle never holds
  # any, and nothing here reads any.
  web:
    name: web (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The build number in the manifest is the commit count.
          fetch-depth: 0
      - name: Install the workspace Rust version and the WebAssembly target
        run: |
          toolchain=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup override set "$toolchain"
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      # The bundle's third-party licences page is made by cargo-about, the version the releases use.
      - name: Install cargo-about
        run: cargo install --locked "cargo-about@0.9.2" --features cli
      # The plugin engine (Luau) is C++ built for the browser with zig's clang and headers: the
      # web client's dev runner names them, and cargo run directly needs the same.
      - name: Install zig, and the plugin engine's build for the browser
        env:
          ZIGLANG_VERSION: 0.15.2
        run: |
          python3 -m pip install --user "ziglang==$ZIGLANG_VERSION"
          zig=$(python3 -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')
          ZIG="$zig" cargo run -q --locked -p dereth-web-dev -- --print-env >> "$GITHUB_ENV"
      - name: Clippy over the browser half
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo clippy --locked -p dereth-web -p dereth-web-front -p auberean-web --target wasm32-unknown-unknown -- -D warnings
      - name: cargo xtask package web (the modules, the deny scan, the manifest)
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo xtask package web --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dereth-web
          path: dist/
          if-no-files-found: error
          retention-days: 7
