name: Release Yalain

# Builds, checks and drafts a Yalain release: the Asheron's Call 2 server, for Windows, Linux and
# macOS. A pushed `yalain-v<version>` tag builds every target and creates a DRAFT GitHub release,
# which a maintainer reviews and publishes by hand. Running it by hand (workflow_dispatch) is a dry
# run: the same builds and checks, the release files kept as a workflow artifact for 7 days,
# nothing published.
#
# Every job runs `cargo xtask package yalain`, the same command a contributor runs locally
# (auberean/RELEASING.md). The CI workflow runs tier 0 on the tagged commit as on every push.
#
# The release's description starts with its notes, which `cargo xtask release-notes yalain` writes
# from the tagged tree: the release's section of yalain/CHANGES.md, then the server's commits since
# the previous yalain-v tag, grouped. A dry run writes the notes the next release would get.

on:
  push:
    tags: ['yalain-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-yalain-${{ github.ref }}
  # A tag can reach this repository twice at once: the newer run takes over, for one build.
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # The build tools, pinned: Empyrean's.
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_ZIGBUILD_VERSION: 0.23.3
  ZIGLANG_VERSION: 0.15.2
  # Where the release files are downloaded from, and the source the notices name: this repository.
  YALAIN_BUILD_SOURCE_URL: https://github.com/${{ github.repository }}

jobs:
  version:
    name: version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the workspace Rust version
        shell: bash
        run: |
          toolchain=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustup override set "$toolchain"
      - name: The tag names the version every yalain-* crate carries, on main
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(cargo xtask version yalain --tag "$GITHUB_REF_NAME")
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main"
              exit 1
            fi
          else
            version=$(cargo xtask version yalain)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Yalain $version"
      - name: The release notes, from CHANGES.md and the commits since the previous release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            cargo xtask release-notes yalain --version "$VERSION" --out target/release-notes.md
          else
            cargo xtask release-notes yalain --out target/release-notes.md
          fi
          cat target/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes-yalain
          path: target/release-notes.md
          if-no-files-found: error
          retention-days: 7

  package:
    name: package (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The build number is the commit count.
          fetch-depth: 0
      - name: Install the workspace Rust version and the target
        run: |
          toolchain=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --target ${{ matrix.target }}
          rustup override set "$toolchain"
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Install cargo-about
        run: cargo install --locked "cargo-about@$CARGO_ABOUT_VERSION" --features cli
      - name: Install zig and cargo-zigbuild (Linux targets, linked against glibc 2.28)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --user "ziglang==$ZIGLANG_VERSION"
          cargo install --locked "cargo-zigbuild@$CARGO_ZIGBUILD_VERSION"
      - name: cargo xtask package yalain
        run: cargo xtask package yalain --target ${{ matrix.target }} --out dist
      - name: Smoke-run the packaged program
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          root="yalain-$VERSION-$TARGET"
          mkdir smoke
          case "$TARGET" in
            *windows*) (cd smoke && 7z x "../dist/$root.zip" > /dev/null) ;;
            *) tar -xzf "dist/$root.tar.gz" -C smoke ;;
          esac
          dir="smoke/$root"
          run() { "$@"; }
          # Linux runs on a runner of its own architecture, in each of these images: AlmaLinux 8
          # carries glibc 2.28, the floor the program is linked against; Ubuntu 24.04 is a current
          # distribution.
          images=""
          case "$TARGET" in
            *-linux-gnu)
              images="almalinux:8 ubuntu:24.04"
              run() { docker run --rm -v "$PWD/$dir:/pkg" -w /pkg "$image" "${@/#$dir//pkg}"; } ;;
          esac
          exe=""; case "$TARGET" in *windows*) exe=".exe" ;; esac
          smoke() {
            run "$dir/yalain$exe" --version | tee version.txt
            grep -qx "yalain $VERSION" version.txt
            grep -qx "target: $TARGET" version.txt
          }
          if [ -n "$images" ]; then
            for image in $images; do
              echo "::group::$image"
              smoke
              echo "::endgroup::"
            done
          else
            smoke
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yalain-${{ matrix.target }}
          path: |
            dist/yalain-*-${{ matrix.target }}.zip
            dist/yalain-*-${{ matrix.target }}.tar.gz
            dist/yalain-*-${{ matrix.target }}.*.manifest
          if-no-files-found: error
          retention-days: 7

  gather:
    name: gather the release
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the workspace Rust version
        run: |
          toolchain=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustup override set "$toolchain"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: yalain-*
          path: dist
          merge-multiple: true
      # Scans every archive again and writes MANIFEST.txt, release.json and SHA256SUMS over them.
      - name: cargo xtask package yalain --gather
        run: cargo xtask package yalain --gather dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-yalain-${{ needs.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/MANIFEST.txt
            dist/release.json
          if-no-files-found: error
          retention-days: 7

  draft:
    name: draft the GitHub release
    if: github.ref_type == 'tag'
    needs: [version, gather]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-yalain-${{ needs.version.outputs.version }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes-yalain
          path: notes
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          # The notes first (highlights, then all changes), then what the release is.
          cp ../notes/release-notes.md ../notes.md
          cat >> ../notes.md <<EOF

          ## Downloads

          Yalain $VERSION, the Asheron's Call 2 server, for Windows, Linux (glibc 2.28 or newer, x86-64 and arm64) and macOS (11 or newer, Apple silicon).

          **No game data is included**: the server reads the data files of your own Asheron's Call 2 install, and \`yalain world fetch\` downloads the world database it is built for. README.md in each archive says how to run it. The Dereth Network launcher downloads and runs it for you.

          Verifying a download: \`sha256sum -c SHA256SUMS --ignore-missing\`
          EOF
          # Every file gets a display label, computed from its target; the file names stay as
          # they are. A file with no label fails the job, so a new target cannot go unlabelled.
          assets=()
          unlabelled=()
          for f in *; do
            label=""
            case "$f" in
              SHA256SUMS) label="Checksums (SHA-256)" ;;
              MANIFEST.txt) label="Release manifest" ;;
              release.json) label="Release facts (JSON)" ;;
              "yalain-$VERSION-"*)
                case "${f#"yalain-$VERSION-"}" in
                  x86_64-pc-windows-msvc.zip) label="Yalain server · Windows x64" ;;
                  x86_64-unknown-linux-gnu.tar.gz) label="Yalain server · Linux x86-64 (glibc 2.28+)" ;;
                  aarch64-unknown-linux-gnu.tar.gz) label="Yalain server · Linux arm64 (glibc 2.28+)" ;;
                  aarch64-apple-darwin.tar.gz) label="Yalain server · macOS Apple silicon" ;;
                esac ;;
            esac
            if [ -n "$label" ]; then
              assets+=("$f#$label")
              echo "$f: $label"
            else
              unlabelled+=("$f")
            fi
          done
          if [ ${#unlabelled[@]} -gt 0 ]; then
            echo "::error::no label for ${unlabelled[*]}"
            exit 1
          fi
          PRE=""
          # A pre-release version carries a suffix (`0.2.0-rc.1`); the tag always holds a hyphen.
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          # Never the repository's "Latest" release: that stays the launcher's and Empyrean's,
          # which players download by hand.
          # A second draft of one tag can't be told from the first, and GitHub allows it.
          tags=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          if grep -qxF "$TAG" <<< "$tags"; then
            echo "::notice::$TAG already has a release"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --latest=false $PRE \
            --title "Yalain $VERSION" --notes-file ../notes.md \
            "${assets[@]}"
