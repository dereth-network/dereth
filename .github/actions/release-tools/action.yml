name: Release tools
description: >-
  cargo-about, which writes the third-party licence pages, and with `tauri` the Tauri CLI, which
  builds the launcher: their published programs at pinned versions, each checked against its
  SHA-256 before it is put on the path. One place for every workflow's pins.

inputs:
  tauri:
    description: Also the Tauri CLI.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install cargo-about and the Tauri CLI
      shell: bash
      env:
        TAURI: ${{ inputs.tauri }}
        SYSTEM: ${{ runner.os }}-${{ runner.arch }}
        CARGO_ABOUT_VERSION: 0.9.2
        TAURI_CLI_VERSION: 2.12.0
      run: |
        set -euo pipefail
        case "$SYSTEM" in
          Windows-X64)
            about=x86_64-pc-windows-msvc
            about_sha=1c03e5890238562497c2d89a3b75b02560af349c1fc3e713d3284f532a5cd748
            tauri=cargo-tauri-x86_64-pc-windows-msvc.zip
            tauri_sha=78785c9b574bbe4bbfe6cc3008422df068a0f661931a9fa9d13d08407604b6a9
            exe=.exe ;;
          Linux-X64)
            about=x86_64-unknown-linux-musl
            about_sha=9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
            tauri=cargo-tauri-x86_64-unknown-linux-gnu.tgz
            tauri_sha=8544e19c4312f653e80f92241ee4212b4d928ad33461bfb1d2997c52560c418f
            exe= ;;
          Linux-ARM64)
            # No Tauri CLI for this system: the launcher is built on none of these runners.
            about=aarch64-unknown-linux-musl
            about_sha=af5169282fb6f84e13471493f405437e43ac517744c9ae12fbe2cdf0a6f0e5a8
            tauri=
            tauri_sha=
            exe= ;;
          macOS-ARM64)
            about=aarch64-apple-darwin
            about_sha=ae72f0df0c399a1e96336f696fa55b1b28679fd725632eba8cf8e4568467cc3e
            tauri=cargo-tauri-aarch64-apple-darwin.zip
            tauri_sha=c0d45bb76b9501ee8871a1712bc8e45d0b6a97d0695e0de85b4477794f07682a
            exe= ;;
          *)
            echo "::error::no pinned build tools for $SYSTEM"
            exit 1 ;;
        esac
        if [ "$TAURI" = true ] && [ -z "$tauri" ]; then
          echo "::error::no pinned Tauri CLI for $SYSTEM"
          exit 1
        fi
        check() {
          if command -v sha256sum > /dev/null; then sha256sum -c -; else shasum -a 256 -c -; fi
        }
        bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        work="$RUNNER_TEMP/release-tools"
        rm -rf "$work"
        mkdir -p "$work" "$bin"
        name="cargo-about-$CARGO_ABOUT_VERSION-$about"
        curl -fsSL -o "$work/about.tar.gz" \
          "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$name.tar.gz"
        echo "$about_sha  $work/about.tar.gz" | check
        # Relative names: GNU tar takes a drive letter (D:\a\_temp) for a host to connect to.
        (cd "$work" && tar -xzf about.tar.gz)
        cp "$work/$name/cargo-about$exe" "$bin/"
        cargo about --version | grep -qx "cargo-about $CARGO_ABOUT_VERSION"
        if [ "$TAURI" = true ]; then
          curl -fsSL -o "$work/$tauri" \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$TAURI_CLI_VERSION/$tauri"
          echo "$tauri_sha  $work/$tauri" | check
          mkdir "$work/tauri"
          case "$tauri" in
            *.zip) (cd "$work/tauri" && unzip -q "../$tauri") ;;
            *) (cd "$work/tauri" && tar -xzf "../$tauri") ;;
          esac
          cp "$work/tauri/cargo-tauri$exe" "$bin/"
          cargo tauri --version | grep -qx "tauri-cli $TAURI_CLI_VERSION"
        fi
