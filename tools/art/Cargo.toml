[package]
name = "dereth-art"
description = "Surveys the models the world is built from: where each one is used, how often, what it is made of, and a picture of it; packs an art pack's folder into one file; and builds the AC2 look from a player's own Asheron's Call 2 files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
# Tier switch only: no code is gated on it. It un-ignores the unit tests that survey real
# landblocks from the retail dats under $DERETH_TEST_DAT_DIR and build the AC2 look from the
# Asheron's Call 2 install under $AUBEREAN_TEST_DAT_DIR.
retail-dats = []

[dependencies]
dereth-primitives.workspace = true
# The retail files and their records.
dereth-dat.workspace = true
dereth-assets.workspace = true
# The interior cells, their statics and the buildings they belong to.
dereth-world-data.workspace = true
# The landblock mesh the scenery is placed on.
dereth-terrain.workspace = true
# The landblock's outdoor contents, placed as the client places them, and the models' parts and
# triangles.
dereth-client-runtime.workspace = true
# The pictures, decoded as the client decodes them, and an art pack opened and packed as the
# client opens it (no device: the scene builds without a backend).
dereth-scene = { workspace = true, features = ["art-pack"] }
# The surface record's type bits.
dereth-render-cpu.workspace = true
png.workspace = true
# A skeleton's transforms.
glam.workspace = true
serde_json.workspace = true
# The AC2 look's tables.
serde.workspace = true
toml.workspace = true
# The AC2 look: the player's own Asheron's Call 2 files, their records and their region.
auberean-assets.workspace = true
auberean-dat = { workspace = true, features = ["fs"] }
auberean-world.workspace = true
# The AC2-in-AC1 world: AC2's placed objects that play, posed as AC2 poses them; its map labels'
# words; and its shapes' coordinates.
auberean-animation.workspace = true
auberean-text.workspace = true
auberean-primitives.workspace = true
# Its objects' effects: AC2's effects, particles and materials made ready as AC2 draws them.
auberean-draw.workspace = true
# The trees a new model or room needs.
dereth-builder.workspace = true
# The starting area's ground and water, told as the server's physics tells them on the converted
# land.
dereth-physics.workspace = true
# The scenery the converted land grows, placed as the client places it.
dereth-landscape.workspace = true
# The overlay's content digest, and each input's.
sha2.workspace = true

[dev-dependencies]
# `dereth_dat::testing`: where the retail-data test finds the dats.
dereth-dat = { workspace = true, features = ["test-support"] }
# `auberean_dat::testing`: where the retail-data test finds the Asheron's Call 2 install.
auberean-dat = { workspace = true, features = ["fs", "test-support"] }

[lints]
workspace = true
