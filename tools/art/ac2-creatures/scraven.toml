# The Scraven: Asheron's Call 2's scraven body, played with its own clips for Asheron's Call's
# motions. Ids and numbers only; the player's own Asheron's Call 2 install supplies the rest.

version = 1
name = "scraven"
label = "Scraven"
entity = 0x4700026C
# The idle's first keys.
bind = 0x0500016D
picture = 512
# Its icon, until its own is drawn: the Zefir's.
icon = 0x060016C3

[[motion]]
command = "Ready"
animation = 0x0500016D

[[motion]]
command = "Ready"
stance = "combat"
# Its fighting idle.
animation = 0x0500016E

[[motion]]
command = "WalkForward"
animation = 0x05000162
# AC2 plays it at 1.5 m/s.
stride = 1.24

[[motion]]
command = "RunForward"
animation = 0x0500016A
# AC2 plays it at 3.228 m/s.
stride = 2.68

[[motion]]
command = "TurnRight"
animation = 0x0500016C

[[motion]]
command = "Falling"
animation = 0x05000170

[[motion]]
command = "AttackHigh1"
animation = 0x0500026A
attack = { height = "high", kind = "punch", part = 0, reach = 2.5 }

[[motion]]
command = "AttackMed1"
animation = 0x05000166
attack = { height = "medium", kind = "punch", part = 20, reach = 2.5 }

[[motion]]
command = "AttackLow1"
animation = 0x05000165
attack = { height = "low", kind = "kick", part = 20, reach = 2.5 }

[[motion]]
command = "Twitch1"
animation = 0x05000494

[[motion]]
command = "Twitch2"
animation = 0x05000494

[[motion]]
command = "StaggerBackward"
animation = 0x05000494

[[motion]]
command = "StaggerForward"
animation = 0x05000494

[[motion]]
