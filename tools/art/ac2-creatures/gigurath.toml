# The Gigurath: Asheron's Call 2's gigurath body, played with its own clips for Asheron's Call's
# motions. Ids and numbers only; the player's own Asheron's Call 2 install supplies the rest.

version = 1
name = "gigurath"
label = "Gigurath"
entity = 0x47000239
# The idle's first keys.
bind = 0x0500053B
picture = 512

[[motion]]
