# The Darkenfowl: Asheron's Call 2's darkenfowl body, played with its own clips for Asheron's Call's
# motions. Ids and numbers only; the player's own Asheron's Call 2 install supplies the rest.

version = 1
name = "darkenfowl"
label = "Darkenfowl"
entity = 0x470001C2
# The idle's first keys.
bind = 0x0500015C
picture = 512
# Its icon, until its own is drawn: the Phyntos Wasp's.
icon = 0x0600103A

[[motion]]
command = "Ready"
animation = 0x0500015C

[[motion]]
command = "Ready"
stance = "combat"
# Its fighting idle.
animation = 0x0500015D

[[motion]]
command = "WalkForward"
animation = 0x05000152
# AC2 plays it at 1.5 m/s.
stride = 3.00

[[motion]]
command = "RunForward"
animation = 0x05000151
# AC2 plays it at 5 m/s.
stride = 3.55

[[motion]]
command = "TurnRight"
animation = 0x0500015B

[[motion]]
command = "Falling"
animation = 0x0500015C

[[motion]]
command = "AttackHigh1"
animation = 0x05000156
attack = { height = "high", kind = "punch", part = 0, reach = 2.5 }

[[motion]]
command = "AttackMed1"
animation = 0x05000155
attack = { height = "medium", kind = "punch", part = 20, reach = 2.5 }

[[motion]]
command = "AttackLow1"
animation = 0x05000237
attack = { height = "low", kind = "kick", part = 20, reach = 2.5 }

[[motion]]
command = "Twitch1"
animation = 0x0500045B

[[motion]]
command = "Twitch2"
animation = 0x0500045B

[[motion]]
command = "StaggerBackward"
animation = 0x0500045B

[[motion]]
command = "StaggerForward"
animation = 0x0500045B

[[motion]]
command = "Dead"
animation = 0x05000154

