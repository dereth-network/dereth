[package]
name = "dereth-corpus"
description = "The corpus tool: records sessions through a logging proxy, pseudonymises them before they are kept, and generates the message corpus and capture index from them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[dependencies]
# The transport. `ParsedPacket` gives the header/payload hashes, `crc::wire_checksum` puts them
# together and `CryptoSystem` is the key stream -- so the scrubbed recordings are checksummed by
# the same code the replay gate checks them with, rather than by a second implementation.
dereth-client-net = { workspace = true, default-features = true, features = ["test-support"] }
dereth-transport.workspace = true
# The four readers discovery is allowed to use: the character set, enter-world, character-delete
# and create-object. Nothing else in a payload is decoded.
dereth-protocol.workspace = true
# The recordings and `pseudonyms.json` are JSON.
serde_json.workspace = true
# Ctrl-C ends a recording cleanly, so it is still split and scrubbed.
ctrlc.workspace = true

[lints]
workspace = true

[[test]]
name = "local"
path = "tests/local/main.rs"
