# A world built from the sample pack alone, over the end-of-retail files.
#
#   cargo run -p dereth-pack -- build tools/pack/sample/world.toml --dats <your client folder>
#
# The overlay and the SQL go to the workspace's target folder; world.lock keeps the ids.
key = "sample-world"
packs = ["holtburg"]
out = "../../../target/pack-sample"
