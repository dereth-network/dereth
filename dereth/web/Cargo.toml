[package]
name = "dereth-web"
description = "The Dereth client in a web browser: the client application in a Web Worker, reading the player's data files on the player's own machine and reaching the server over a WebSocket, directly or through a relay on the player's machine."
# Dereth's version: the client's and the launcher's, which `cargo xtask release dereth` moves.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lib]
# `cdylib` is the WebAssembly module the page loads; `rlib` keeps the host build and the unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The data store the page's files are opened into.
dereth-client-sdk.workspace = true
# The graphics device on its `wgpu` backend: WebGPU in a browser that has it, WebGL 2 in one that
# does not. The page prepares the device and the client comes up on it.
dereth-render = { workspace = true, features = ["wgpu"] }
dereth-primitives.workspace = true
dereth-client-contract.workspace = true
# The application: the client shell's front end, on this crate's host, and the scene it draws.
dereth-client-shell = { workspace = true, default-features = true }
dereth-scene = { workspace = true, default-features = true }
# What the host and the playable client name by crate: the runtime's platform seams and
# configuration, the session's host parsing, the data store, the modern UI's display modes and the
# shared key codes.
dereth-client-runtime.workspace = true
dereth-client-net = { workspace = true, default-features = true }
# The WebSocket frame, shared with the server's endpoint and the relay.
dereth-transport.workspace = true
dereth-dat.workspace = true
dereth-ui-screens.workspace = true
dereth-input.workspace = true
# The classic interface's text: its font atlas, drawn from the fonts the client carries.
dereth-classic-dat.workspace = true
dereth-classic-fonts.workspace = true
tracing.workspace = true

[dev-dependencies]
dereth-client-sdk = { workspace = true, features = ["test-support"] }
# Blocks on the GPU backend's asynchronous set-up in the native tests.
pollster.workspace = true

[features]
# Tier switch only: the native device integration test runs with it and is ignored
# without it.
retail-dats = []

# The browser bindings exist only in the WebAssembly build; the host build compiles the
# platform-neutral half and its tests.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
js-sys = "0.3.104"
# The subscriber for the runtime's events, written to the browser console.
tracing-subscriber.workspace = true
# The GPU backend's set-up is asynchronous in a browser; this turns it into a promise.
wasm-bindgen-futures = "0.4.77"
web-sys = { workspace = true, features = ["OffscreenCanvas"] }

[lints]
workspace = true

[[test]]
name = "play"
path = "tests/play.rs"
