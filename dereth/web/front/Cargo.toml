[package]
name = "dereth-web-front"
description = "The web front page's launcher: the desktop launcher's own logic in a small WebAssembly module of its own, which the page loads first and which holds neither game."
# Dereth's version: the web client's, which `cargo xtask release dereth` moves.
version = "0.4.13"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lib]
# `cdylib` is the WebAssembly module the page loads; `rlib` keeps the host build and the unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The launcher's logic: the world list, the worlds, the data sets, plugin sources.
dereth-launch.workspace = true
# The client's own files and a world's overlay, as this browser keeps them.
dereth-web-store.workspace = true
# How the client names a world's overlay folder.
dereth-client-net = { workspace = true, default-features = true }
dereth-client-runtime.workspace = true
dereth-dat.workspace = true
dereth-primitives.workspace = true
serde_json.workspace = true

[dev-dependencies]
dereth-client-sdk = { workspace = true, features = ["test-support"] }
# Small, well-formed dats built in memory, for the front page's set matching.
dereth-launch = { workspace = true, features = ["testing"] }

# The browser bindings exist only in the WebAssembly build; the host build compiles the
# platform-neutral half and its tests.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
js-sys = "0.3.104"

[lints]
workspace = true
