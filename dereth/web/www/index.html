<!doctype html>
<html lang="en" class="still" data-realm="dereth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dereth</title>
<link rel="stylesheet" href="launcher.css">
<link rel="stylesheet" href="web.css">
</head>
<body>
<div id="stage"><canvas id="view" width="800" height="600" tabindex="0"></canvas></div>

<div id="launch">
  <div class="vista" id="vista"></div>
  <div class="shell">
    <aside class="side">
      <div class="lockup">
        <span class="crest"><img class="emblem" src="assets/emblem/dereth.webp" alt=""></span>
        <div class="word">DERETH<br>NETWORK</div>
      </div>
      <div class="realm" id="realm" role="radiogroup" aria-label="Game"></div>
      <nav class="rail" id="rail"></nav>
      <div class="foot" id="foot"></div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div class="notice" id="notice" aria-live="polite"></div>
</div>

<input id="files" type="file" multiple accept=".dat" hidden
       title="The four client_*.dat files, and portal.dat and cell.dat from before Throne of Destiny for the classic interface and the early worlds">
<input id="plugin-folder" type="file" webkitdirectory hidden>
<input id="plugin-zip" type="file" accept=".zip,application/zip" multiple hidden>

<div id="status"></div>
<pre id="log"></pre>

<script type="module" src="play.js"></script>
</body>
</html>
