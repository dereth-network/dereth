# Dereth, the launcher: a Tauri web app over `dereth-launch`, the launcher's knowledge.
#
# A workspace of its own, apart from the main workspace: Tauri brings a web view (WebKitGTK on
# Linux) and a long dependency list, and neither the main workspace's builds and checks nor the
# logic crate's tests should need them. Built from this folder with `cargo tauri build`.
[workspace]
# `crates/launch` belongs to the main workspace (it names it); here it is only a path dependency.
exclude = ["crates"]

[package]
name = "dereth-launcher"
description = "Dereth, the launcher: worlds, accounts, data files, and the Dereth client."
version = "0.4.8"
edition = "2021"
rust-version = "1.98"
license = "MIT"
publish = false

# The executable is `dereth` (`dereth.exe`): the program a player opens is Dereth.
[[bin]]
name = "dereth"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
dereth-launch = { path = "crates/launch" }
# A new plugin repository, made from the Plugins page: the template the author's tool writes, from
# the same library.
dereth-plugin-template = { path = "../../tools/plugin-template" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# The launcher updates itself (and the client beside it) from the signed `latest.json` of the
# repository's newest published Dereth release, which it finds by listing the releases.
tauri-plugin-updater = "2"
# Join links (`dereth://join?...`): on macOS the system hands a running app the link as an event,
# which this plugin receives; the scheme itself is in the bundle (`plugins.deep-link` in
# `tauri.conf.json`). On Windows and Linux the link is the program's argument.
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# One JSON document at a time over TLS (the world directory, a status, the release list); no async runtime needed for that.
ureq = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
toml = "1"
toml_edit = "0.25"
ctrlc = { version = "3.5", features = ["termination"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Passwords in the login Keychain.
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
# The worlds already running here: the process list, a process's command line, the UDP ports each
# process holds, and the services.
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Passwords in Credential Manager.
keyring = { version = "3", features = ["windows-native"] }
# A pad on the launcher's page, read through the system's XInput, as the client reads it.
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
# The message when the WebView2 runtime is missing, shown before any web view exists. The same
# crate the dialog plugin draws its dialogs with.
rfd = { version = "0.16", default-features = false }
# The desktop shortcut, a `.lnk` file.
mslnk = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Passwords in the desktop's keyring over the Secret Service (GNOME Keyring, KWallet). Pure-Rust
# crypto, and libdbus built in, so neither OpenSSL nor the D-Bus development files are needed.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
# The program name, from which the window's Wayland app id and X11 class come; the same GLib the
# web view already links.
glib = "0.18"

[dev-dependencies]
tempfile = "3"
dereth-launch = { path = "crates/launch", features = ["testing"] }


[profile.test-release]
inherits = "release"
debug-assertions = true
overflow-checks = true
