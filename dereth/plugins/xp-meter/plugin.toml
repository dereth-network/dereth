id = "network.dereth.xpmeter"
name = "XP Meter"
version = "0.2.0"
api = "0.7"
entry = "main.lua"
description = "Experience, kills, deaths and luminance this session and per hour, and what each monster you fight does, in two small windows and on /xp."
