id = "network.dereth.navigator"
name = "Navigator"
version = "0.5.0"
api = "0.7"
entry = "main.lua"
description = "Navigator helps you get from point A to point B; it is an autonomous navigation plugin in the vein of GoArrow for Decal."
authors = ["Dereth"]
license = "MIT"

[permissions]
"act.interactive" = "Goes to the place you pick when you click Go or type /nav go or /nav travel, through portals and by your recalls where the client makes journeys."
"auto.nav" = "Carries on along a route between points, where the world allows it."

[capabilities]
required = ["ui.window"]
optional = ["overlay.world", "overlay.map", "map.clicks", "nav.moveto", "nav.journey", "nav.path", "game.data"]
