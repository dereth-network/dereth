id = "network.dereth.navigator"
name = "Navigator"
version = "0.5.0"
api = "0.7"
entry = "main.lua"
description = "Points the way, in the manner of GoArrow: one Where to? search for the places this world has shown you by name and type (dungeons, where portals send, portals, lifestones, shops, people, houses, recalls, places of your own, coordinates), Go to travel there through portals and recalls or on foot, Point for the arrow alone; an arrow HUD with your coordinates and the way; saved places, coordinates seen in chat and spots clicked on the map; the ways to a place, a map of the dungeon you are in with the way and the creatures on it, and VTank routes walked round what stands in the way."
authors = ["Dereth"]
license = "MIT"

[permissions]
"act.interactive" = "Goes to the place you pick when you click Go or type /nav go or /nav travel, through portals and by your recalls where the client makes journeys."
"auto.nav" = "Carries on along a route between points, where the world allows it."

[capabilities]
required = ["ui.window"]
optional = ["ui.hud", "overlay.arrow", "overlay.world", "overlay.map", "map.clicks", "nav.moveto", "nav.journey", "nav.path", "game.data"]
