[package]
name = "dereth-desktop"
description = "The desktop host: the window and its event loop, the message pump, the settings folders, the sound device, the clipboard, the cursors, the pads, the log and the crash log, for any product that runs the client shell on a desktop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# A stray tests/*.rs cannot become a test target silently.
autotests = false

[features]
# Builds the carried classic fonts into a Windows client too, so `DERETH_CLASSIC_FONTS=carried`
# can draw with them for comparison; a release leaves it off.
carried-fonts = ["dep:dereth-classic-fonts"]

[dependencies]
dereth-primitives.workspace = true
# The host trait this implements, and the shell's own halves of the window, pump, clipboard and
# cursor that the desktop's are built over.
dereth-client-shell.workspace = true
# The configuration, the platform seams (`Platform`, the clock, the pacer, the window host) and
# the mixer's output seam.
dereth-client-runtime.workspace = true
# The display-mode list the options page's drop-downs are built from.
dereth-client-contract.workspace = true
# The window placement arithmetic and the monitor work area.
dereth-render = { workspace = true, features = ["mock"] }
# The key and scan-code tables the pump turns a key into.
dereth-input.workspace = true
# Finding the retail dats, and protecting the install, at start-up.
dereth-dat.workspace = true
# The two unsafe hops, each confined to its own crate: the system clipboard, and the console and
# the OS error box.
dereth-clipboard.workspace = true
dereth-console.workspace = true
# The classic interface's text: the Windows font system on Windows, the client's own fonts
# elsewhere (below). On Windows the carried fonts are built in only with `carried-fonts`.
dereth-classic-dat.workspace = true
dereth-classic-fonts = { workspace = true, optional = true }
tracing.workspace = true
# The one subscriber a product's `main` installs (`logging`).
tracing-subscriber.workspace = true
# The window and the message pump; Linux's backends are added below.
winit = { workspace = true, features = ["rwh_06"] }
# The window icon, decoded for the window systems that take pixels.
png.workspace = true
# The sound device.
cpal.workspace = true

# The local clock and the URL launch on Windows (WinRT, safe bindings).
[target.'cfg(windows)'.dependencies]
# The classic interface's fonts from the Windows font system.
dereth-classic-gdi.workspace = true
windows = { version = "0.62", features = ["Foundation", "Globalization", "System"] }
# The pads, through the system's XInput.
gilrs = { workspace = true, features = ["xinput"] }

# The same two host services off Windows.
[target.'cfg(not(windows))'.dependencies]
# The classic interface's fonts, carried by the client off Windows.
dereth-classic-fonts.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { workspace = true, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }

[lints]
workspace = true
