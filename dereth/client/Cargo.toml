[package]
name = "dereth-client"
description = "The Dereth 3D client: the window, the graphics device, the renderer, the modern UI and the sound device, plugged into the runtime's frame loop."
# Dereth's release version, which the launcher (dereth/launcher) carries too: they are released
# together (`cargo xtask release dereth`).
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# One test target per tier, listed at the bottom of this file. `autotests = false` so that a
# stray `tests/*.rs` cannot silently become another link step.
autotests = false

[build-dependencies]
# Links the application icon (`assets/dereth.ico`) into the executable. Explorer, the taskbar and
# Alt-Tab read the icon out of the binary before any of our code runs, so it cannot be a file
# loaded at start-up. Same crate and version as the launcher's build script uses.
embed-resource = "3"

# `vulkan` and `d3d12` are on by default and forward to dereth-render's features of the same names,
# which gate the real devices. `d3d12` compiles to nothing off Windows, so a plain build on Windows
# has both backends and the `Renderer=` preference can choose either; Vulkan is still the one used
# when nothing chooses. Without them the crate still builds and the pure-logic units
# (config, the message pump, the frame order) still test, which is what keeps
# `cargo check --no-default-features` honest on a host with no graphics driver at all.
[features]
# Fixture access through the client facade; ordinary clients leave this disabled.
test-support = ["dereth-client-shell/test-support"]
# The carried classic fonts in a Windows client too, for `DERETH_CLASSIC_FONTS=carried`.
carried-fonts = ["dereth-desktop/carried-fonts"]
default = ["vulkan", "d3d12", "wgpu"]
vulkan = ["dereth-render/vulkan", "dereth-scene/vulkan", "dereth-client-shell/vulkan"]
# `wgpu` forwards to dereth-render's third backend: Metal, Vulkan or Direct3D 12 through `wgpu`,
# selected with `--renderer wgpu` or `Renderer=wgpu`.
wgpu = ["dereth-render/wgpu", "dereth-scene/wgpu", "dereth-client-shell/wgpu"]
# `d3d12` forwards to dereth-render's feature of the same name: the Direct3D 12 device. It is an
# *option beside* Vulkan on Windows, never instead of it -- Vulkan stays the default everywhere --
# and which one a run uses is chosen at
# startup by `--renderer vulkan|d3d12`, or the `Renderer=` preference.
d3d12 = ["dereth-render/d3d12", "dereth-scene/d3d12", "dereth-client-shell/d3d12"]
# Tier switch only: no code is gated on it. It selects the `dat` and `gpu` test binaries,
# whose modules read the retail dats under $DERETH_TEST_DAT_DIR.
retail-dats = []

# The product composes the desktop host and application shell. Tests additionally exercise
# their shared subsystems directly.
[dependencies]
dereth-client-runtime.workspace = true
dereth-primitives.workspace = true
dereth-render = { workspace = true, features = ["mock"] }
dereth-client-shell.workspace = true
dereth-desktop.workspace = true
dereth-scene.workspace = true
dereth-ui.workspace = true
dereth-console.workspace = true
# The headless replay translates recorded host events and physical controls.
dereth-input.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Register the product's desktop entry and icon with the launcher conventions.
dereth-launch.workspace = true

[dev-dependencies]
dereth-terrain.workspace = true
dereth-rules.workspace = true
dereth-client-shell = { workspace = true, features = ["test-support"] }
dereth-chargen.workspace = true
dereth-client-contract.workspace = true
dereth-client-runtime = { workspace = true, features = ["test-support"] }
dereth-world-render.workspace = true
dereth-assets.workspace = true
dereth-animation.workspace = true
dereth-transport.workspace = true
dereth-protocol.workspace = true
dereth-client-model = { workspace = true, features = ["test-support"] }
dereth-ui-screens.workspace = true
dereth-audio.workspace = true
dereth-client-net = { workspace = true, default-features = true, features = ["test-support"] }
# Recorded movement comparisons retain the physics trace recorder.
dereth-physics = { workspace = true, features = ["trace"] }
dereth-dat = { workspace = true, features = ["test-support"] }
dereth-render = { workspace = true, features = ["mock", "test-support"] }
dereth-world-data.workspace = true
dereth-classic-ui.workspace = true
glam.workspace = true
winit = { workspace = true, features = ["rwh_06"] }
# Capture tests inspect PNGs; production encoding belongs to the scene and icon decoding
# belongs to the desktop host.
png.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
winit = { workspace = true, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }

[lints]
workspace = true

# Three test binaries, one per tier:
#
#   cpu  no retail dats, no device        `cargo test -p dereth-client --test cpu`
#   dat  reads the retail dats            `... --features retail-dats --test dat`
#   gpu  holds a device (a software rasteriser is enough)          `... --features retail-dats,vulkan --test gpu`
#        The test-only `DERETH_TEST_RENDERER=d3d12` runs the same binary on the D3D12 device,
#        which the default features include on Windows.
#
# Each test file is a module of its tier's binary: run one with `--test <tier> <stem>::<fn>`.
[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]

[[test]]
name = "gpu"
path = "tests/gpu/main.rs"
required-features = ["retail-dats", "vulkan"]
