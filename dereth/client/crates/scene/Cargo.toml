[package]
name = "dereth-scene"
description = "The client's drawn world: the landblock window, its objects, the sky, the particles and the preview spaces, drawn on the graphics device."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# The crate's tests are its modules' unit tests; the client's tier binaries exercise it through the
# desktop client.
autotests = false

# A device backend is what the drawing is gated on: without one the crate still builds and holds
# the scene's plain types, as the desktop client does with no backend. `wgpu` is the default,
# because it builds for every target, the browser's included; the desktop client turns this off and
# forwards its own three.
[features]
default = ["wgpu"]
vulkan = ["dereth-render/vulkan"]
wgpu = ["dereth-render/wgpu"]
d3d12 = ["dereth-render/d3d12"]
# The optional high-fidelity presentation (`dereth-render-hifi`) and the bridge that hands it the
# frame. Off unless a build asks for it; without it the scene builds no bridge and behaves exactly
# as before.
hifi = ["dep:dereth-render-hifi", "dereth-render/hifi", "dereth-client-runtime/hifi", "wgpu"]
# Tier switch only: no code is gated on it. It un-ignores the unit tests that read the retail dats
# under $DERETH_TEST_DAT_DIR.
retail-dats = []

[dependencies]
dereth-terrain.workspace = true
dereth-world-data.workspace = true
dereth-primitives.workspace = true
# The simulation the scene draws: the world state, the object stream, the models, the movement,
# the landblock window's residency, and the presentation seam the scene implements.
dereth-client-runtime.workspace = true
dereth-render = { workspace = true, features = ["mock"] }
dereth-render-hifi = { workspace = true, optional = true }
dereth-world-render.workspace = true
dereth-dat.workspace = true
dereth-assets.workspace = true
dereth-physics.workspace = true
dereth-animation.workspace = true
# The landscape's terrain neighbourhood, which picks the ambient sounds.
dereth-audio.workspace = true
# The wire appearance a server object arrives with.
dereth-protocol.workspace = true
# The target reticule's projection and the preferences the renderer applies.
dereth-client-contract.workspace = true
# The character-generation state the preview spaces read.
dereth-chargen.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The matrix type `dereth_render::camera` is expressed in. Same version as dereth-render's.
glam.workspace = true
# A monotonic clock a browser can read too; natively it is the standard library's.
web-time.workspace = true
# The capture writes a PNG.
png.workspace = true

[dev-dependencies]
# The options page's restore-defaults list, which one test checks the renderer's seed against.
dereth-ui-screens.workspace = true
# `dereth_dat::testing`: where the tests find the retail dats.
dereth-dat = { workspace = true, features = ["test-support"] }
# `DERETH_TEST_RENDERER`: the backend a test's device comes up on.
dereth-render = { workspace = true, features = ["mock", "test-support"] }

[lints]
workspace = true
