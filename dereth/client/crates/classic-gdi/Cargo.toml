[package]
name = "dereth-classic-gdi"
description = "The classic interface's text rasterisation with system fonts, supplied by the desktop host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

# NOT `[lints] workspace = true`, for the reason `dereth-clipboard` gives: the workspace forbids
# unsafe code, and `forbid` cannot be lifted by an inner `#[allow]`. `deny` here, with the
# exception on the Windows font module only.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
cast_possible_truncation = "warn"
undocumented_unsafe_blocks = "warn"

[dependencies]
dereth-classic-dat.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
