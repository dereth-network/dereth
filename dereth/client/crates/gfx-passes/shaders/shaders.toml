# The shared passes' shaders. `cargo xtask shaders` compiles each entry point below for each target
# into `compiled/`, which is checked in; `src/shaders.rs` embeds the blobs. The modules here
# (`bindless`, `frame`, `atmosphere`, `weather`) are imported by the remasters' own shaders too.
# The traced shadows' and occlusion's shaders (`rt_shadow`, `rt_ao`) are compiled in each game's
# folder instead, each against that game's own `rt` module, which reads its scene's structures.
targets = ["spirv", "dxil"]

# A triangle that covers the whole target, for the passes that read one picture and write
# another.
[[entry]]
source = "fullscreen.slang"
entry = "vs_main"
stage = "vertex"

# Ambient occlusion: this frame's at half resolution, gathered over the frames, and brought up to
# the full resolution.
[[entry]]
source = "ao.slang"
entry = "fs_gtao"
stage = "fragment"

[[entry]]
source = "ao.slang"
entry = "fs_gather"
stage = "fragment"

[[entry]]
source = "ao.slang"
entry = "fs_upsample"
stage = "fragment"

# How much of the sun reaches each pixel the sun lights, from the cascades' shadow maps.
[[entry]]
source = "shadow_mask.slang"
entry = "fs_main"
stage = "fragment"

# The post passes: the temporal anti-aliasing (and its check of the motion), the bloom down and
# back up, and the tone map.
[[entry]]
source = "post.slang"
entry = "fs_taa"
stage = "fragment"

[[entry]]
source = "post.slang"
entry = "fs_taa_check"
stage = "fragment"

[[entry]]
source = "post.slang"
entry = "fs_bloom_down"
stage = "fragment"

[[entry]]
source = "post.slang"
entry = "fs_bloom_up"
stage = "fragment"

[[entry]]
source = "post.slang"
entry = "fs_tonemap"
stage = "fragment"

# The lamps: each piece of the view's list of the lamps that reach it, which the game's own
# shading reads.
[[entry]]
source = "lamps.slang"
entry = "cs_clusters"
stage = "compute"

# The soft halo round each lamp the eye can see, added over the scene's colors.
[[entry]]
source = "halo.slang"
entry = "vs_halo"
stage = "vertex"

[[entry]]
source = "halo.slang"
entry = "fs_halo"
stage = "fragment"

# The sky's tables: the transmittance, the light scattered more than once, and the sky as seen
# from the eye.
[[entry]]
source = "sky_tables.slang"
entry = "fs_transmittance"
stage = "fragment"

[[entry]]
source = "sky_tables.slang"
entry = "fs_multiple"
stage = "fragment"

[[entry]]
source = "sky_tables.slang"
entry = "fs_sky_view"
stage = "fragment"

# The physical sky over the authored dome, and the haze's veil over the horizon.
[[entry]]
source = "sky.slang"
entry = "fs_sky"
stage = "fragment"

[[entry]]
source = "sky.slang"
entry = "fs_veil"
stage = "fragment"
