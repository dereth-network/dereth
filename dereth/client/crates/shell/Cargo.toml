[package]
name = "dereth-client-shell"
description = "The client's front end over the runtime: the retail UI, the HUD's panels, the cursor, the clipboard bridge, the device input and the renderer that draws the UI over the scene, generic over the platform under it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Unit tests cover the shell modules; the isolated host test owns process-wide hooks.
autotests = false

# As the scene's: the renderer is gated on a device backend, `wgpu` by default because it builds
# for every target, and the desktop client turns this off and forwards its own three.
[features]
default = ["wgpu"]
vulkan = ["dereth-scene/vulkan", "dereth-render/vulkan"]
wgpu = ["dereth-scene/wgpu", "dereth-render/wgpu"]
d3d12 = ["dereth-scene/d3d12", "dereth-render/d3d12"]
# Tier switch only: no code is gated on it. It un-ignores the unit tests that read the retail dats
# under $DERETH_TEST_DAT_DIR.
retail-dats = []

[dependencies]
dereth-chargen.workspace = true
dereth-primitives.workspace = true
dereth-client-contract.workspace = true
# The application state machine, its frame loop and the platform seams the host fills.
dereth-client-runtime.workspace = true
dereth-client-model.workspace = true
dereth-client-net = { workspace = true, default-features = true }
dereth-protocol.workspace = true
dereth-dat.workspace = true
dereth-assets.workspace = true
dereth-physics.workspace = true
dereth-animation.workspace = true
dereth-audio.workspace = true
# The drawn world and the device it is on.
dereth-scene.workspace = true
dereth-render = { workspace = true, features = ["mock"] }
dereth-world-render.workspace = true
# The UI framework, the retail screens and the device input under them.
dereth-ui.workspace = true
dereth-ui-screens.workspace = true
dereth-input.workspace = true
# The classic interface, which the shell runs in the retail interface's place when it is chosen.
dereth-classic-ui.workspace = true
dereth-classic-dat.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# `dereth_dat::testing`: where the tests find the retail dats.
dereth-dat = { workspace = true, features = ["test-support"] }
# `DERETH_TEST_RENDERER`: the backend a test's device comes up on.
dereth-render = { workspace = true, features = ["mock", "test-support"] }

[lints]
workspace = true

[[test]]
name = "host_resources"
path = "tests/host_resources.rs"
required-features = ["retail-dats"]
