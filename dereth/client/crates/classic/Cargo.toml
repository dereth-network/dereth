[package]
name = "dereth-classic-ui"
description = "The classic interface: the game's screens as they were before the 2005 redesign, as a front end on the shared runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[[test]]
name = "cpu"
path = "tests/cpu.rs"

[features]
# Tier switch only: no code is gated on it. It un-ignores the unit tests that read the retail dats
# under $DERETH_TEST_DAT_DIR and the classic portal under $DERETH_CLASSIC_PORTAL.
retail-dats = []

[dependencies]
dereth-world-data.workspace = true
dereth-primitives.workspace = true
dereth-text.workspace = true
dereth-dat.workspace = true
dereth-client-contract.workspace = true
dereth-client-runtime.workspace = true
dereth-client-model.workspace = true
dereth-animation.workspace = true
dereth-physics.workspace = true
dereth-chargen.workspace = true
dereth-assets.workspace = true
dereth-protocol.workspace = true
dereth-rules = { workspace = true, default-features = true }
dereth-input.workspace = true
# The game's presentation rules, shared with the retail interface.
dereth-presentation.workspace = true
dereth-ui.workspace = true
# The item and spell icons are pictures of the world's own dats, decoded as the scene decodes them.
dereth-scene.workspace = true
dereth-classic-dat.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
dereth-client-runtime = { workspace = true, features = ["test-support"] }
dereth-client-model = { workspace = true, features = ["test-support"] }
dereth-client-net = { workspace = true, default-features = true }
dereth-dat = { workspace = true, features = ["test-support"] }
# One layout test measures the title with the fonts the desktop draws it with.
dereth-classic-gdi.workspace = true

[lints]
workspace = true
