[package]
name = "dereth-classic-ui"
description = "The classic interface: the game's screens as they were before the 2005 redesign, as a front end on the shared runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[[test]]
name = "cpu"
path = "tests/cpu.rs"

[features]
# Tier switch only: no code is gated on it. It un-ignores the unit tests that read the retail dats
# under $DERETH_TEST_DAT_DIR and the classic portal under $DERETH_CLASSIC_PORTAL.
retail-dats = []

[dependencies]
dereth-primitives.workspace = true
dereth-dat.workspace = true
dereth-client-contract = { path = "../../../../core/client-contract" }
dereth-client-runtime = { path = "../../../../core/client-runtime" }
dereth-client-model = { path = "../../../../core/client-model" }
dereth-animation = { path = "../../../../core/animation" }
dereth-physics = { path = "../../../../core/physics" }
dereth-assets = { path = "../../../../core/assets" }
dereth-protocol = { path = "../../../../core/protocol" }
dereth-rules = { path = "../../../../core/rules" }
dereth-input = { path = "../input" }
# The game's presentation rules, shared with the retail interface.
dereth-presentation = { path = "../../../../core/presentation" }
dereth-ui = { path = "../ui" }
# The item and spell icons are pictures of the world's own dats, decoded as the scene decodes them.
dereth-scene = { path = "../scene", default-features = false }
dereth-classic-dat = { path = "../classic-dat" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
dereth-dat = { workspace = true, features = ["test-support"] }
# One layout test measures the title with the fonts the desktop draws it with.
dereth-classic-gdi = { path = "../classic-gdi" }

[lints]
workspace = true
