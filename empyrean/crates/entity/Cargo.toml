[package]
name = "empyrean-entity"
description = "The port of ACE's Source/ACE.Entity: the generated enums with their attribute tables, and the entity models."
version = "0.2.0" # Empyrean's own version, shared by every empyrean-* crate (not the workspace's)
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
publish.workspace = true

[lib]
doctest = false

[dependencies]
empyrean-common.workspace = true
# The wire and data types the conversions in `shared_types` produce, and the qualities bridge
# (`adapter::quality_bridge`): a biota in the wire's qualities form, and back.
dereth-protocol.workspace = true
dereth-primitives.workspace = true

[dev-dependencies]
dereth-animation.workspace = true
dereth-physics.workspace = true
dereth-rules = { workspace = true, default-features = true }
# The golden-vector tests (tests/all/vectors.rs) build the harness's JSON shapes.
serde_json.workspace = true

[[test]]
name = "all"
path = "tests/all/main.rs"

# The server's lint levels, not the client workspace's (no `undocumented_unsafe_blocks`, and
# `module_inception` allowed: ACE folders often contain a file of the same name, e.g.
# Entity/Chess/Chess.cs, and the mirror is deliberate).
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
cast_possible_truncation = "warn"
module_inception = "allow"
