[package]
name = "empyrean-command"
description = "The port of Source/ACE.Server/Command: the console and in-game admin commands, with Empyrean's own commands kept apart."
version = "0.3.6" # Empyrean's own version, shared by every empyrean-* crate (not the workspace's)
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
publish.workspace = true

[lib]
doctest = false

[features]
# Tier switch only: selects the real-content test modules, which read the retail dats under
# DERETH_TEST_DAT_DIR and fail when they are absent.
real-content = ["empyrean-dat/real-content"]

[dependencies]
empyrean-world.workspace = true
empyrean-common.workspace = true
empyrean-entity.workspace = true
empyrean-net.workspace = true
empyrean-store.workspace = true
empyrean-content.workspace = true
empyrean-dat.workspace = true
dereth-physics.workspace = true
dereth-primitives.workspace = true
# The playtest characters: their budget, how it is spent, and the checks they pass.
dereth-progression.workspace = true
empyrean-tables.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The interactive console: raw-mode key input and the terminal size (log lines print above the
# prompt and the half-typed line, which is redrawn after them).
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }

[dev-dependencies]
empyrean-testkit.workspace = true
# The real-content tests find the retail dats as the other tiers do.
dereth-dat = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }

[[test]]
name = "all"
path = "tests/all/main.rs"

# The server's lint levels, not the client workspace's (no `undocumented_unsafe_blocks`, and
# `module_inception` allowed: ACE folders often contain a file of the same name, e.g.
# Entity/Chess/Chess.cs, and the mirror is deliberate).
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
cast_possible_truncation = "warn"
module_inception = "allow"
