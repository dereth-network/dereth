[package]
name = "empyrean-testkit"
description = "The server's in-process test harness: a whole server on a virtual clock, with wire-speaking bots over an in-memory network."
version = "0.1.2" # Empyrean's own version, shared by every empyrean-* crate (not the workspace's)
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
publish.workspace = true

[lib]
doctest = false

[features]
# Tier switches only. `real-content` selects the tests that read the
# retail dats under DERETH_TEST_DAT_DIR and world.pack under
# EMPYREAN_TEST_WORLD_PACK (default world.pack in the repository). `captures` adds the
# capture-replay tier: every recording in fixtures/packet-captures/ replayed against a TestServer
# on that real content; it needs both inputs and fails when either is absent.
real-content = ["empyrean-world/real-content", "empyrean-dat/real-content", "empyrean-content/real-content"]
captures = ["real-content"]
# The soak and load suite (`empyrean_testkit::soak`, `tests/all/soak/soak_runs.rs`). Real content only; never in
# the default gate (the server gate's `--soak` tier runs it).
soak = ["real-content"]

[dependencies]
# The capture-replay tier reads the recordings' JSON lines; so do the soak profile and its
# baselines (`soak_profile`, always built so the unit tier tests it).
serde_json.workspace = true
empyrean-world.workspace = true
# The test client and the in-memory driver.
empyrean-net = { workspace = true, features = ["testing"] }
empyrean-store.workspace = true
empyrean-content.workspace = true
empyrean-dat.workspace = true
empyrean-common.workspace = true
empyrean-entity.workspace = true
dereth-assets.workspace = true
dereth-transport.workspace = true
dereth-physics.workspace = true
dereth-protocol.workspace = true
dereth-primitives.workspace = true
# `dereth_dat::testing`: where the real-content tiers find the retail dats.
dereth-dat = { workspace = true, features = ["test-support"] }

[[test]]
name = "all"
path = "tests/all/main.rs"

[dev-dependencies]
dereth-client-net.workspace = true
# The golden-vector schema test needs exact double parsing.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# The chat command scenarios drive empyrean-command through a TestServer.
empyrean-command.workspace = true

# The server's lint levels, not the client workspace's (no `undocumented_unsafe_blocks`, and
# `module_inception` allowed: ACE folders often contain a file of the same name, e.g.
# Entity/Chess/Chess.cs, and the mirror is deliberate).
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
cast_possible_truncation = "warn"
module_inception = "allow"
