[package]
name = "auberean-testkit"
description = "Test support: the behaviour registry, and where the private test data is."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[features]
# Reading the recorded sessions (the capture index): `captures`. Off by default, so test
# binaries that do not read them do not build the database engine.
captures = ["dep:rusqlite"]

[dependencies]
auberean-dat = { workspace = true, features = ["test-support"] }
rusqlite = { workspace = true, optional = true }

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"
