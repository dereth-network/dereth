[package]
name = "auberean-web"
description = "Auberean in a web browser: the client application in a Web Worker, reading the player's data files on the player's own machine and reaching the server over one WebSocket."
version = "0.1.5" # Auberean's own version, shared by the client and the headless client (not the workspace's)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lib]
# `cdylib` is the WebAssembly module the page loads; `rlib` keeps the host build and the unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
auberean-shell.workspace = true
# The game's own interface (the retail screens), and what opens its records.
auberean-interface.workspace = true
auberean-ui.workspace = true
auberean-client-sdk = { workspace = true, features = ["fs"] }
auberean-scene.workspace = true
auberean-draw.workspace = true
auberean-gpu.workspace = true
auberean-present.workspace = true
# The sound device's seam, which the page's audio worklet answers.
dereth-audio.workspace = true
# The WebSocket frame, shared with the servers' endpoint and the relay.
dereth-transport.workspace = true
# The one file the client's own files are kept in.
dereth-primitives.workspace = true
tracing.workspace = true

# The browser bindings exist only in the WebAssembly build; the host build compiles the
# platform-neutral half and its tests.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
js-sys = "0.3.104"
wasm-bindgen-futures = "0.4.77"
web-sys = { workspace = true, features = ["OffscreenCanvas"] }
# The subscriber for the client's events, written to the browser console.
tracing-subscriber.workspace = true
# WebGPU where the browser has it, and WebGL 2 for one that does not.
wgpu = { version = "30", features = ["webgl"] }

[lints]
workspace = true
