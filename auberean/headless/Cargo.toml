[package]
name = "auberean-headless"
description = "The client with no window: logs in to a server on loopback, enters the world and plays a script of commands, on the SDK alone."
version = "0.1.10" # Auberean's own version, shared by the client and the headless client (not the workspace's)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "auberean-headless"
path = "src/main.rs"

[features]
# Tier switches: `retail-corpus` selects the `corpus` test binary, which replays every recorded
# 2017 game login through the client against a server double; `retail-dats` the `dat` binary (the
# player's body walked by the controls through the September 2013 world, with no window).
retail-corpus = []
retail-dats = []

[dependencies]
auberean-client-sdk = { workspace = true, features = ["fs", "net", "lua", "wasm-interpreter"] }

[dev-dependencies]
auberean-dat = { workspace = true, features = ["test-support", "fs"] }
# The places and turns the server double puts the player at.
auberean-primitives.workspace = true
auberean-testkit = { workspace = true, features = ["double", "captures"] }

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]

[[test]]
name = "corpus"
path = "tests/corpus/main.rs"
required-features = ["retail-corpus"]
