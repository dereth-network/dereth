# The remaster's shaders. `cargo xtask shaders` compiles each entry point below for each target
# into `compiled/`, which is checked in; `src/shaders.rs` embeds the blobs.
targets = ["spirv", "dxil"]
# The shared passes' modules: the bindless table, the frame's rows and the light classes.
imports = ["../../../../../dereth/client/crates/gfx-passes/shaders"]

# The landscape: the near terrain's bottom layer and its blended layers, each with the clouds and
# the fog laid on, and the far landscape.
[[entry]]
source = "terrain.slang"
entry = "vs_terrain"
stage = "vertex"

[[entry]]
source = "terrain.slang"
entry = "fs_terrain_base"
stage = "fragment"

[[entry]]
source = "terrain.slang"
entry = "fs_terrain_mask"
stage = "fragment"

[[entry]]
source = "terrain.slang"
entry = "fs_terrain_far"
stage = "fragment"

# The sky's fog veil over the whole picture.
[[entry]]
source = "terrain.slang"
entry = "vs_veil"
stage = "vertex"

[[entry]]
source = "terrain.slang"
entry = "fs_veil"
stage = "fragment"

# In linear light, the sky drawn in display values into a picture of its own, laid in.
[[entry]]
source = "terrain.slang"
entry = "fs_sky_in"
stage = "fragment"

# The placed objects and the sky's objects: the vertex program's pieces, then the texture stages
# or the normal-mapped pixel programs.
[[entry]]
source = "mesh.slang"
entry = "vs_mesh"
stage = "vertex"

[[entry]]
source = "mesh.slang"
entry = "fs_mesh"
stage = "fragment"

# The water: the ripples' picture, and the reflection laid over the water's surface.
[[entry]]
source = "mesh.slang"
entry = "fs_ripple"
stage = "fragment"

[[entry]]
source = "mesh.slang"
entry = "fs_water"
stage = "fragment"

# The depth's pass before the frame: what the opaque surfaces cover, their light classes and their
# normals, for the shared passes.
[[entry]]
source = "mesh.slang"
entry = "fs_mesh_depth"
stage = "fragment"

[[entry]]
source = "terrain.slang"
entry = "fs_terrain_depth"
stage = "fragment"

# The sun's casters into its cascades' maps: what the alpha of a mesh's first stage covers (the
# landscape's are drawn with its own vertex program and no fragment program).
[[entry]]
source = "mesh.slang"
entry = "vs_mesh_caster"
stage = "vertex"

[[entry]]
source = "mesh.slang"
entry = "fs_mesh_caster"
stage = "fragment"

# The moving bodies' motion: each draw of a body that moved since the last frame, writing where its
# surface was last frame, for the anti-aliasing.
[[entry]]
source = "motion.slang"
entry = "vs_motion"
stage = "vertex"

[[entry]]
source = "motion.slang"
entry = "fs_motion"
stage = "fragment"

# The lamps' light at each pixel, from the shared passes' lists of the lamps that reach each piece
# of the view.
[[entry]]
source = "lamps.slang"
entry = "fs_lamps"
stage = "fragment"

# Where the device traces rays: how much of the sun reaches each pixel, by rays traced toward it,
# and the ambient occlusion by rays traced over each pixel's hemisphere, then evened out. The
# shared passes' shaders, compiled here against this folder's `rt`.
[[entry]]
source = "rt_shadow.slang"
from = "../../../../../dereth/client/crates/gfx-passes/shaders"
entry = "fs_main"
stage = "fragment"

[[entry]]
source = "rt_ao.slang"
from = "../../../../../dereth/client/crates/gfx-passes/shaders"
entry = "fs_rays"
stage = "fragment"

[[entry]]
source = "rt_ao.slang"
from = "../../../../../dereth/client/crates/gfx-passes/shaders"
entry = "fs_filter"
stage = "fragment"
