# The remaster's shaders. `cargo xtask shaders` compiles each entry point below for each target
# into `compiled/`, which is checked in; `src/shaders.rs` embeds the blobs.
targets = ["spirv", "dxil"]
# The shared passes' modules: the bindless table, the frame's rows and the light classes.
imports = ["../../../../../dereth/client/crates/gfx-passes/shaders"]

# The landscape: the near terrain's bottom layer and its blended layers, the shadow map and the
# clouds laid over them, their fog, and the far landscape.
[[entry]]
source = "terrain.slang"
entry = "vs_terrain"
stage = "vertex"

[[entry]]
source = "terrain.slang"
entry = "fs_terrain_base"
stage = "fragment"

[[entry]]
source = "terrain.slang"
entry = "fs_terrain_mask"
stage = "fragment"

[[entry]]
source = "terrain.slang"
entry = "fs_terrain_shade"
stage = "fragment"

[[entry]]
source = "terrain.slang"
entry = "fs_terrain_fog"
stage = "fragment"

[[entry]]
source = "terrain.slang"
entry = "fs_terrain_far"
stage = "fragment"

# The sky's fog veil over the whole picture.
[[entry]]
source = "terrain.slang"
entry = "vs_veil"
stage = "vertex"

[[entry]]
source = "terrain.slang"
entry = "fs_veil"
stage = "fragment"

# The placed objects and the sky's objects: the vertex program's pieces, then the texture stages
# or the normal-mapped pixel programs.
[[entry]]
source = "mesh.slang"
entry = "vs_mesh"
stage = "vertex"

[[entry]]
source = "mesh.slang"
entry = "fs_mesh"
stage = "fragment"

# The water: the ripples' picture, and the reflection laid over the water's surface.
[[entry]]
source = "mesh.slang"
entry = "fs_ripple"
stage = "fragment"

[[entry]]
source = "mesh.slang"
entry = "fs_water"
stage = "fragment"

# The depth's pass before the frame: what the opaque surfaces cover, and their light classes, for
# the shared passes.
[[entry]]
source = "mesh.slang"
entry = "fs_mesh_depth"
stage = "fragment"

[[entry]]
source = "terrain.slang"
entry = "fs_terrain_depth"
stage = "fragment"
