[package]
name = "auberean-ui-game"
description = "The game's panels on the interface's element framework, each finding its elements by name in the retail layouts, as the September 2013 client's panels do."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[features]
# Tier switch only: no code is gated on it. It selects the `dat` test binary, whose modules read
# the retail install under $AUBEREAN_TEST_DAT_DIR.
retail-dats = []

[dependencies]
auberean-ui.workspace = true
# Where a cell lies on the land (the map's marks and places).
auberean-primitives.workspace = true
# String references with variables (the toolbar's tooltips, the dialogs' messages).
auberean-text.workspace = true
# The original's float-to-integer conversion.
dereth-primitives.workspace = true

[dev-dependencies]
auberean-dat = { workspace = true, features = ["fs", "test-support"] }
auberean-assets.workspace = true
auberean-testkit.workspace = true

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]
