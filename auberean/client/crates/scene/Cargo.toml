[package]
name = "auberean-scene"
description = "The world a window shows, with no device and no platform: the player's body moved by the world's physics and reported through the client, the bodies of everything else the client knows, the chase camera under the player's control, and the frame drawn from them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[features]
# Tier switches: `retail-dats` and `retail-corpus` together select the `corpus` test binary (the
# recorded sessions' combat played through the client and the scene in the September 2013 world).
retail-dats = []
retail-corpus = ["auberean-testkit/captures"]

[dependencies]
auberean-primitives.workspace = true
auberean-dat.workspace = true
auberean-assets.workspace = true
auberean-world.workspace = true
auberean-physics.workspace = true
auberean-animation.workspace = true
auberean-draw.workspace = true
# The client: its model of the world and the body it reports.
auberean-client-sdk.workspace = true
# The transcendental functions, the same bits on every host; positions and cells.
dereth-primitives.workspace = true
tracing.workspace = true

[dev-dependencies]
# The collision spheres a test body is made of.
dereth-physics.workspace = true
auberean-testkit.workspace = true
# The install a recorded session is played in.
auberean-dat = { workspace = true, features = ["test-support", "fs"] }

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "corpus"
path = "tests/corpus/main.rs"
required-features = ["retail-dats", "retail-corpus"]
