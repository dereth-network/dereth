[package]
name = "auberean-draw"
description = "What a frame of the world draws, with no device: the terrain's layers, the placed objects and interiors, and the sky, as batches carrying their pictures, materials and the moment's light."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[features]
# Tier switch: selects the `dat` test binary, whose tests read the retail installs.
retail-dats = ["auberean-dat/retail-dats"]

[dependencies]
auberean-primitives.workspace = true
auberean-dat.workspace = true
auberean-assets.workspace = true
auberean-world.workspace = true
# Bodies: their posed skeletons and skinning.
auberean-animation.workspace = true
# Doorways clipped to the camera's view, as the client clips polygons to planes.
auberean-physics.workspace = true
# The original's float-to-integer conversion.
dereth-primitives.workspace = true
# The picture codecs (block compression, JPEG): the same picture record as Dereth's world.
dereth-render-cpu.workspace = true
# The block window: which landblocks are around the viewer.
dereth-landscape.workspace = true
# A body's moved vertices go to the device as they are.
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
auberean-dat = { workspace = true, features = ["test-support", "fs"] }
auberean-testkit.workspace = true

[lints]
workspace = true

[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]
