[package]
name = "auberean-horizon"
description = "The Horizon interface for the second game: the client's own interface beside the game's, drawn from Horizon's art, reading the game through its view and asking for things as the client's actions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[features]
# Tier switch only: no code is gated on it. It selects the `dat` test binary (the shell with both
# interfaces against a server double, in the September 2013 install's records) and the `gpu` one
# (the same on a graphics device).
retail-dats = []

[dependencies]
# The interface seam it plugs into, the game it reads there and the requests it makes.
auberean-shell.workspace = true
# The client's contract: its view, events, notices and actions; and the string downloads that
# write a name the view gives as a reference.
auberean-client-sdk.workspace = true
# The game's records an interface reads: its string tables, and its pictures for the effects'
# icons.
auberean-ui.workspace = true
# The client's own preferences, as the options pages edit them: the interface choice.
auberean-options.workspace = true
# The widget kit it is drawn with, and Horizon's own art, which name no game.
dereth-ui-kit.workspace = true
dereth-horizon-art.workspace = true
# The sounds a story asks to be played.
auberean-audio.workspace = true
# The player's figure in the inventory window: how tall the look draws, and the look itself.
auberean-scene.workspace = true
# The world's records the map reads (the region's map pictures and labels, its calendar) and the
# layouts' records, for the credits' text.
auberean-assets.workspace = true
auberean-world.workspace = true
# The client's random numbers, which the interfaces are handed.
auberean-primitives.workspace = true
# Float-to-integer conversion, the same on every host.
dereth-primitives.workspace = true
# The map's picture drawn as Dereth's Horizon draws its own: the light, the shrink, the build off
# the frame.
dereth-map-picture.workspace = true
# A map that could not be drawn says why.
tracing.workspace = true

[dev-dependencies]
# The game's own interface, chosen back.
auberean-interface.workspace = true
auberean-testkit = { workspace = true, features = ["double"] }
auberean-dat = { workspace = true, features = ["test-support", "fs"] }
# The data files on disk, and the Luau engine a plugin in the shell runs on.
auberean-client-sdk = { workspace = true, features = ["fs", "lua"] }
# Portal space's phases, as the scene keeps them; and the view behind character select drawn on a
# graphics device, and written as a picture to look at.
auberean-draw.workspace = true
auberean-gpu.workspace = true
png.workspace = true
# The map window composed over the world on a graphics device, and read back.
auberean-present.workspace = true
wgpu = "30"

[lints]
workspace = true

# The interface's HUD, chat and settings driven frame by frame from a game state, with no
# install, no device and no server.
[[test]]
name = "cpu"
path = "tests/cpu/main.rs"

# Both interfaces in the shell against a server double, in the September 2013 install's records.
[[test]]
name = "dat"
path = "tests/dat/main.rs"
required-features = ["retail-dats"]

# Horizon's screens before the world drawn on a graphics device, in the end-of-retail install.
[[test]]
name = "gpu"
path = "tests/gpu/main.rs"
required-features = ["retail-dats"]
