[package]
name = "auberean-client"
description = "The desktop client: a window in which Asheron's Call 2's world is drawn and played."
version = "0.1.4" # Auberean's own version, shared by the client and the headless client (not the workspace's)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "auberean"
path = "src/main.rs"

[build-dependencies]
# Links the application icon (`assets/auberean.ico`) into the executable, where Explorer and the
# task bar read it before any of our code runs.
embed-resource = "3"

[dependencies]
auberean-shell.workspace = true
# The game's own interface (the retail screens) and the records it draws from.
auberean-interface.workspace = true
auberean-ui.workspace = true
auberean-scene.workspace = true
auberean-draw.workspace = true
auberean-gpu.workspace = true
# Putting a frame in the window.
auberean-present.workspace = true
auberean-world.workspace = true
auberean-assets.workspace = true
auberean-dat = { workspace = true, features = ["fs"] }
auberean-client-sdk = { workspace = true, features = ["fs"] }
# The transcendental functions, the same bits on every host.
dereth-primitives.workspace = true
# The sound device, and the output seam the game's sound plays through.
dereth-audio.workspace = true
dereth-audio-out.workspace = true
# The window and its events, and the device it presents on.
winit = { workspace = true, features = ["rwh_06"] }
wgpu = "30"
png.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The web page a request opens, and the box when it cannot.
open = "5"
dereth-console.workspace = true
# The local time for the scripts' chat log.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { workspace = true, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }

[lints]
workspace = true
